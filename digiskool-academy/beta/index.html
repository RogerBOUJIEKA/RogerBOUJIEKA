<style>
/* Concept "cahier et ardoise".
   Day: a school exercise book. Cool white paper, fountain-pen blue ink for every action, the red margin line for prices on
   promotion and deadlines only, Seyès ruling on the opening page only, covers that look like labelled notebooks
   (same design, one colour per product). Night: the classroom slate.
   Type: Bricolage Grotesque for titles and prices, Atkinson Hyperlegible Next for reading the interface (built for legibility),
   Literata for the books themselves. Layout: one phone-width column, left-aligned, quiet cards with borders instead of shadows. */
:root {
  --bg: #F5F6FA; --surface: #FFFFFF; --surface-2: #EEF0F6; --line: #E0E4ED; --line-2: #C9CFDC;
  --fg: #151A2D; --fg-2: #4C5469; --fg-3: #80889D;
  --ink: #2A3CC4; --ink-hover: #1F2EA3; --ink-soft: #E8EBFA; --on-ink: #FFFFFF;
  --hero-1: #4A63F0; --hero-2: #2A3CC4; --hero-3: #1A2788; --hero-gold: #FFC83D;
  --marge: #D3344A; --marge-soft: #FBEAEC; --on-marge: #FFFFFF;
  --ok: #0D8A5E; --ok-soft: #E2F3EB; --on-ok: #FFFFFF;
  --gold: #D99A06; --wa: #25D366; --on-wa: #08311F; --wa-icon: #FFFFFF;
  --rule: rgba(42, 60, 196, .04); --rule-2: rgba(42, 60, 196, .085); --margin-line: rgba(211, 52, 74, .5);
  --label: #FFFFFF; --cover-ink: #151A2D; --cover-meta: #5A6075; --cover-rule: #E2E5EE;
  --page: #FFFFFF; --page-ink: #2B3142; --sepia-bg: #F5EEDF; --sepia-fg: #3A2F1F; --night-bg: #0E1412; --night-fg: #E4EAE5;
  --scrim: rgba(12, 16, 28, .48); --frame: #0B0F1A;
  --shadow: 0 1px 2px rgba(21, 26, 45, .05), 0 8px 24px rgba(21, 26, 45, .07);
  --shadow-lg: 0 24px 60px rgba(21, 26, 45, .22);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --text: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --read: "Literata", Georgia, "Times New Roman", serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 12px; --r-card: 16px; --r-sheet: 22px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0E1412; --surface: #141C19; --surface-2: #1B2521; --line: #24302B; --line-2: #34423B;
    --fg: #ECF1ED; --fg-2: #A9B5AE; --fg-3: #77847C;
    --ink: #97A6FF; --ink-hover: #B2BDFF; --ink-soft: #1D2440; --on-ink: #0C1130;
    --marge: #FF7684; --marge-soft: #381C21; --on-marge: #24080D;
    --ok: #4FCB9C; --ok-soft: #12302A; --on-ok: #062118;
    --gold: #F0BB3A;
    --rule: rgba(236, 241, 237, .045); --rule-2: rgba(236, 241, 237, .085); --margin-line: rgba(255, 118, 132, .5);
    --scrim: rgba(0, 0, 0, .62); --frame: #000000;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28);
    --shadow-lg: 0 24px 60px rgba(0, 0, 0, .55);
    --hero-1: #2C3FB0; --hero-2: #1D2A86; --hero-3: #101850;
    color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0E1412; --surface: #141C19; --surface-2: #1B2521; --line: #24302B; --line-2: #34423B;
    --fg: #ECF1ED; --fg-2: #A9B5AE; --fg-3: #77847C;
    --ink: #97A6FF; --ink-hover: #B2BDFF; --ink-soft: #1D2440; --on-ink: #0C1130;
    --marge: #FF7684; --marge-soft: #381C21; --on-marge: #24080D;
    --ok: #4FCB9C; --ok-soft: #12302A; --on-ok: #062118;
    --gold: #F0BB3A;
    --rule: rgba(236, 241, 237, .045); --rule-2: rgba(236, 241, 237, .085); --margin-line: rgba(255, 118, 132, .5);
    --scrim: rgba(0, 0, 0, .62); --frame: #000000;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28);

    color-scheme: dark; }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.55 var(--text); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--ink); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; font-family: var(--display); font-weight: 700; letter-spacing: -.02em; line-height: 1.12; text-wrap: balance; }
p { margin: 0; }
ol { margin: 0; padding: 0; list-style: none; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.small { font-size: 14.5px; }
.xs { font-size: 13px; }
.kicker { font: 700 12.5px/1.2 var(--text); letter-spacing: .09em; text-transform: uppercase; color: var(--fg-3); }
.h2 { font-size: 25px; }
.h3 { font: 700 19px/1.2 var(--display); letter-spacing: -.015em; }
.clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.center { text-align: center; justify-items: center; }

/* Shell: the phone column scrolls; on wide screens a beta guide sits beside a framed phone */
.shell { height: 100%; display: flex; justify-content: center; align-items: center; gap: 40px; }
.guide-side { display: none; }
.app { position: relative; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; container-type: inline-size; }
.scroller { position: relative; flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
@media (min-width: 1024px) {
  .shell { padding-block: 24px; }
  .app { width: 420px; height: min(880px, calc(100% - 8px)); border-radius: 36px; border: 8px solid var(--frame); box-shadow: var(--shadow-lg); }
  .guide-side { display: block; width: 330px; max-height: calc(100% - 8px); overflow: auto; }
}
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.scroller.enter > * { animation: enter .32s var(--ease) both; }
@keyframes enter { from { opacity: .35; transform: translateY(6px); } }

svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.xs { width: 13px; height: 13px; } svg.i.sm { width: 16px; height: 16px; } svg.i.lg { width: 24px; height: 24px; } svg.i.xl { width: 30px; height: 30px; }

/* Promo strip and header */
.promo { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 2px 8px; width: 100%; padding: 8px 16px; background: var(--marge-soft); color: var(--marge); font-size: 14px; font-weight: 700; text-align: center; }
.promo .cd { color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.header { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 2px; min-height: 60px; padding: 8px 8px 8px max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(12px); backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.brand { display: inline-flex; align-items: center; gap: 9px; margin-right: auto; }
.logo { width: 30px; height: 30px; flex: none; }
.wordmark { font: 700 19.5px/1 var(--display); letter-spacing: -.035em; white-space: nowrap; }
.wordmark i { font-style: normal; color: var(--ink); }
.hbtn { min-width: 42px; height: 42px; padding: 0 6px; border-radius: 10px; display: grid; place-items: center; position: relative; font: 700 14px/1 var(--text); letter-spacing: .04em; transition: background .15s; }
.hbtn:hover { background: var(--surface-2); }
.hbtn .badge { position: absolute; top: 4px; right: 3px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--marge); color: var(--on-marge); font-size: 11px; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: var(--r); border: 1.5px solid transparent; font: 700 16px/1.2 var(--text); text-align: center; transition: background .18s var(--ease), border-color .18s var(--ease), transform .12s var(--ease); }
.btn:active { transform: scale(.985); }
.btn-primary { background: var(--ink); color: var(--on-ink); }
.btn-primary:hover { background: var(--ink-hover); }
.btn-line { background: var(--surface); border-color: var(--line-2); color: var(--fg); }
.btn-line:hover { border-color: var(--fg-3); }
.btn-quiet { background: var(--surface-2); color: var(--fg); }
.btn-wa { background: var(--wa); color: var(--on-wa); }
.btn-lg { min-height: 56px; font-size: 17px; }
.btn-sm { min-height: 40px; padding: 0 14px; font-size: 14.5px; }
.btn-block { width: 100%; }
.link { color: var(--ink); font-weight: 700; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.icon-btn { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; border: 1.5px solid var(--line-2); background: var(--surface); flex: none; }
.icon-btn.sm { width: 36px; height: 36px; border-radius: 9px; }

/* Hero: the one ruled page */
.u { position: relative; white-space: nowrap; color: var(--ink); }
.u svg { position: absolute; left: -2%; width: 104%; bottom: -.17em; height: .34em; overflow: visible; }
.u path { fill: none; stroke: var(--marge); stroke-width: 3.4; stroke-linecap: round; stroke-dasharray: 240; stroke-dashoffset: 240; animation: ink .9s .35s var(--ease) forwards; }
@keyframes ink { to { stroke-dashoffset: 0; } }
.fan { display: flex; justify-content: center; align-items: flex-end; padding: 14px 0 4px; }
.fan > button { width: 31%; max-width: 150px; flex: none; transition: transform .25s var(--ease); }
.fan > button:nth-child(1) { transform: rotate(-8deg) translate(20%, 7%); }
.fan > button:nth-child(2) { position: relative; z-index: 2; }
.fan > button:nth-child(3) { transform: rotate(8deg) translate(-20%, 7%); }
.trust { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14.5px; font-weight: 700; }
.trust span { display: inline-flex; align-items: center; gap: 6px; }
.trust svg { color: var(--ok); }

/* Sections */
.section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding-top: 36px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-head h2 { font-size: 25px; }
.sec-head .link { font-size: 15px; white-space: nowrap; }
.sec-note { margin-top: -8px; }

/* Covers: a labelled exercise book, one colour per product */
.cover { --c: #2A3CC4; position: relative; display: block; width: 100%; max-width: 100%; aspect-ratio: 5 / 7; border-radius: 3px 8px 8px 3px; overflow: hidden; container-type: inline-size; color: var(--label); text-align: left;
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 80%, #FFFFFF) 0%, var(--c) 40%, color-mix(in srgb, var(--c) 78%, #000000) 100%);
  box-shadow: inset 5cqw 0 0 rgba(0, 0, 0, .16), inset 5.6cqw 0 0 rgba(255, 255, 255, .14), 0 1px 1px rgba(0, 0, 0, .12), 0 12px 22px -10px rgba(0, 0, 0, .45); }
.cover::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, .07) 1px, transparent 1px); background-size: 100% 6cqw; }
.cv-label { position: absolute; left: 15%; right: 9%; top: 12%; background: var(--label); color: var(--cover-ink); border-radius: 2.4cqw; padding: 7cqw 6.5cqw 6cqw; display: grid; gap: 3cqw;
  box-shadow: inset 0 0 0 1.6cqw var(--label), inset 0 0 0 2.1cqw var(--c), 0 1cqw 3cqw rgba(0, 0, 0, .18); }
.cv-brand { font: 800 4.4cqw/1 var(--text); letter-spacing: .16em; color: var(--c); }
.cv-t { font: 800 10.6cqw/1.02 var(--display); letter-spacing: -.035em; text-wrap: balance; }
.cv-a { font: 600 4.6cqw/1.2 var(--text); color: var(--cover-meta); border-top: .5cqw solid var(--cover-rule); padding-top: 3cqw; }
.cv-foot { position: absolute; left: 15%; right: 9%; bottom: 6.5%; display: flex; justify-content: space-between; font: 700 4.4cqw/1 var(--text); letter-spacing: .12em; text-transform: uppercase; opacity: .92; }
.cv-tag { position: absolute; top: 6%; right: 7%; background: var(--label); color: var(--cover-ink); font: 800 4.6cqw/1 var(--text); padding: 2.2cqw 3.2cqw; border-radius: 1.6cqw; letter-spacing: .06em; text-transform: uppercase; }
.thumb { display: block; width: 46px; flex: none; }
.thumb.lg { width: 64px; }

/* Prices */
.pr { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; min-width: 0; }
.price { font: 700 19px/1.1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
.was { color: var(--fg-3); text-decoration: line-through; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.off { background: var(--marge); color: var(--on-marge); font: 700 12.5px/1 var(--text); padding: 4px 6px; border-radius: 6px; white-space: nowrap; align-self: center; }
.pr.big .price { font-size: 30px; letter-spacing: -.03em; }
.pr.big .was { font-size: 16px; }
.deadline { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; color: var(--marge); font-weight: 700; font-size: 14.5px; }
.deadline .num, .deadline b { white-space: nowrap; }
.stars { color: var(--gold); letter-spacing: 1px; white-space: nowrap; }
.stars .dim { color: var(--line-2); }
.st { display: inline-flex; align-items: center; gap: 4px; color: var(--fg); font-weight: 700; }
.st svg { color: var(--gold); fill: currentColor; }

/* Product rows */
.plist { display: grid; gap: 10px; }
.prow { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 14px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.prow > button:first-child { align-self: start; }
.prow-b { display: grid; gap: 5px; align-content: start; min-width: 0; }
.prow-type { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); }
.prow-t { font: 700 17px/1.22 var(--display); letter-spacing: -.015em; text-align: left; }
.prow-meta { font-size: 14px; color: var(--fg-2); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.prow-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: 4px; }
.add { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; border: 1.5px solid var(--line-2); color: var(--fg); flex: none; background: var(--surface); }
.add[aria-pressed="true"] { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.soon { font-size: 14px; color: var(--fg-2); }
.soon b { color: var(--fg); }

/* Featured book */
.feature { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
.feature-top { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 16px; padding: 18px 16px; background: color-mix(in srgb, var(--c) 8%, var(--surface)); }
.feature-top .prow-t { font-size: 20px; }
.feature-bot { padding: 16px; display: grid; gap: 12px; border-top: 1px solid var(--line); }
.duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }

/* How it works: a real three-step sequence */
.steps { display: grid; }
.step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; position: relative; padding-bottom: 22px; }
.step:last-child { padding-bottom: 0; }
.step:not(:last-child)::before { content: ""; position: absolute; left: 16px; top: 40px; bottom: 4px; width: 2px; background: var(--line-2); }
.step .n { width: 34px; height: 34px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); color: var(--ink); display: grid; place-items: center; font: 800 15px/1 var(--display); }
.step > div > b { display: block; font: 700 18px/1.25 var(--display); letter-spacing: -.01em; margin: 5px 0 3px; }
.ussd { margin-top: 12px; max-width: 290px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; box-shadow: var(--shadow); font-size: 15px; }
.ussd .pin { height: 30px; border-bottom: 2px solid var(--ink); font: 700 18px/30px var(--mono); letter-spacing: .4em; color: var(--fg-3); }
.ussd .acts { display: flex; justify-content: flex-end; gap: 22px; font-weight: 800; font-size: 13.5px; letter-spacing: .05em; color: var(--ink); text-transform: uppercase; }

/* Promo code */
.coupon { border: 1.5px dashed color-mix(in srgb, var(--marge) 55%, transparent); background: var(--marge-soft); border-radius: var(--r-card); padding: 20px 18px; display: grid; gap: 10px; }
.coupon h3 { font-size: 26px; letter-spacing: -.03em; }
.code { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 6px 6px 16px; min-width: 0; }
.code > span { font: 700 19px/1 var(--mono); letter-spacing: .14em; min-width: 0; }
.code > span.url { font: 700 15px/1.2 var(--text); letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Lists */
.feats { display: grid; gap: 18px; }
.feat { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: start; }
.feat .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--ink-soft); color: var(--ink); display: grid; place-items: center; }
.feat b { display: block; font: 700 17px/1.25 var(--display); margin-bottom: 2px; }
.checks { display: grid; gap: 10px; }
.checks > div { display: flex; gap: 10px; align-items: flex-start; }
.checks svg { color: var(--ok); margin-top: 3px; }

/* Reviews */
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: 84%; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); scroll-padding-inline: 16px; }
.rail::-webkit-scrollbar { display: none; }
.review { scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px; display: grid; gap: 12px; align-content: start; }
.review .rv-t { font: italic 400 16px/1.6 var(--read); }
.who { display: flex; gap: 10px; align-items: center; }
.ava { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 800 15px/1 var(--display); background: var(--ink-soft); color: var(--ink); flex: none; }
.verified { color: var(--ok); font-weight: 700; }
.reply { border-left: 2px solid var(--ink); padding-left: 12px; font-size: 14.5px; color: var(--fg-2); }
.reply b { display: block; color: var(--fg); font-size: 13px; }
.rating-sum { display: flex; align-items: center; gap: 14px; }
.rating-sum .big { font: 800 44px/1 var(--display); letter-spacing: -.04em; }

/* Author, community, FAQ, support */
.author, .wa-block, .panel, .receipt { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.author-id { display: flex; gap: 14px; align-items: center; }
.author .ava { width: 60px; height: 60px; font-size: 20px; background: var(--ink); color: var(--on-ink); }
.wa-chip { width: 46px; height: 46px; border-radius: 13px; background: color-mix(in srgb, var(--wa) 14%, var(--surface)); color: var(--on-wa); display: grid; place-items: center; flex: none; }
.wa-chip.sm { width: 38px; height: 38px; border-radius: 11px; }
.faq { border-top: 1px solid var(--line); }
.faq-item { border-bottom: 1px solid var(--line); }
.faq-item > button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 2px; font: 700 16.5px/1.35 var(--text); text-align: left; }
.faq-item .pm { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; transition: transform .2s var(--ease); }
.faq-item[data-open="true"] .pm { transform: rotate(45deg); }
.faq-item .body { padding: 0 2px 16px; color: var(--fg-2); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; background: var(--surface-2); border-radius: var(--r); }
.seg button { min-height: 42px; border-radius: 9px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--fg-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.cur-list { display: grid; }
.cur-list button { display: flex; gap: 12px; align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--line); text-align: left; }
.cur-list button > span:nth-child(2) { flex: 1; min-width: 0; }
.cur-list button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
.cur-list .px { font-variant-numeric: tabular-nums; color: var(--fg-2); white-space: nowrap; }
.conv-row { display: flex; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: var(--r); background: var(--surface-2); }
.offer-head { display: grid; gap: 8px; }
.offer-head h2 { font-size: 30px; letter-spacing: -.035em; }
.flip-stage { display: grid; justify-items: center; }
.flip-stage .pg { width: min(78%, 300px); font-size: 13px; }
.flip-stage .pg h4 { font-size: 16px; }
.flip-stage .pg .no { font-size: 11px; }
.flip-nav { display: flex; justify-content: center; align-items: center; gap: 16px; }
.quote-card { background: var(--c); color: #FFFFFF; border-radius: var(--r-card); padding: 26px 22px; display: grid; gap: 16px; }
.quote-card p { font: italic 400 21px/1.45 var(--read); }
.quote-card .qf { display: flex; gap: 12px; align-items: center; font-size: 13.5px; opacity: .92; }

/* Beta guide (wide screens) */
.guide-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; display: grid; gap: 14px; }
.guide { display: grid; gap: 14px; font-size: 15px; }
.journey { display: grid; gap: 6px; }
.journey button { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 14.5px; }
.journey button b { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; font-size: 12.5px; flex: none; }
.note { background: var(--surface-2); border-radius: var(--r); padding: 12px 14px; font-size: 14px; color: var(--fg-2); }
.note b { color: var(--fg); }

/* Payment brand marks */
.payrow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.plogo { height: 26px; width: 42px; border-radius: 5px; overflow: hidden; display: inline-grid; place-items: center; flex: none; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(15, 20, 40, .14); }
.plogo svg { display: block; width: 100%; height: 100%; }
.plogo.orange { width: 26px; }
.plogo.visa svg { width: 72%; height: auto; }
.plogo.mc svg { width: 62%; height: auto; }
.plogo.bank { color: var(--cover-ink); }
.mlogos { display: inline-flex; gap: 4px; flex: none; }
.method .plogo { height: 32px; width: 50px; }
.method .plogo.orange { width: 32px; }
.method .mlogos .plogo { width: 38px; height: 26px; }
.ussd-op { display: flex; align-items: center; gap: 8px; }
.ussd-op .plogo { height: 22px; width: 34px; }
.dlg .ussd-op { gap: 5px; }
.dlg .ussd-op .plogo { height: 15px; width: 24px; border-radius: 3px; }
.dlg .ussd-op .plogo.orange { width: 15px; }
.wa-mark { flex: none; display: inline-block; vertical-align: -4px; }

/* Cover illustration */
.cv-motif { position: absolute; left: 0; top: -8%; width: 100%; height: 100%; opacity: .34; pointer-events: none; }

/* Theme illustrations, slowly animated */
.mf .mf-float { animation: mfFloat 7s ease-in-out infinite; animation-delay: var(--d, 0s); }
@keyframes mfFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.mf .mf-bars rect { transform-box: fill-box; transform-origin: bottom; animation: mfGrow 4.8s var(--ease) infinite; }
.mf .mf-bars rect:nth-child(2) { animation-delay: .2s; } .mf .mf-bars rect:nth-child(3) { animation-delay: .4s; } .mf .mf-bars rect:nth-child(4) { animation-delay: .6s; }
@keyframes mfGrow { 0% { transform: scaleY(.25); } 35%, 80% { transform: scaleY(1); } 100% { transform: scaleY(.25); } }
.mf .mf-draw { stroke-dasharray: 260; stroke-dashoffset: 260; animation: mfDraw 4.8s var(--ease) infinite; }
@keyframes mfDraw { 0% { stroke-dashoffset: 260; } 40%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 260; } }
.mf .mf-spin { transform-box: fill-box; transform-origin: center; animation: mfSpin var(--s, 50s) linear infinite; }
@keyframes mfSpin { to { transform: rotate(360deg); } }
.mf .mf-pulse, .mf .mf-dot { animation: mfPulse 1.6s ease-in-out infinite; animation-delay: var(--d, 0s); }
.mf .mf-dot { fill: #FFFFFF; stroke: none; }
@keyframes mfPulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
.mf .mf-node { transform-box: fill-box; transform-origin: center; animation: mfNode 3s ease-in-out infinite; animation-delay: var(--d, 0s); }
@keyframes mfNode { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
.mf .mf-rings circle { transform-box: fill-box; transform-origin: center; animation: mfRing 3.2s ease-out infinite; }
.mf .mf-rings circle:nth-child(2) { animation-delay: .4s; } .mf .mf-rings circle:nth-child(3) { animation-delay: .8s; }
@keyframes mfRing { 0%, 100% { transform: scale(.85); opacity: .4; } 50% { transform: scale(1.05); opacity: 1; } }
.feature-top { position: relative; overflow: hidden; }
.feature-top > .mf { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--c); opacity: .13; }
.feature-top > .mf g { stroke: currentColor; }
.feature-top > :not(.mf) { position: relative; }

/* Product hero */
.p-hero { position: relative; overflow: hidden; color: #FFFFFF; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 80%, #FFFFFF) 0%, var(--c) 34%, color-mix(in srgb, var(--c) 56%, #000000) 100%); }
.p-hero > .mf { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .22; }
.p-hero-in { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 18px; padding-block: 6px 26px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.p-hero .crumbs { justify-self: stretch; color: rgba(255, 255, 255, .82); }
.p-hero .crumbs button { color: #FFFFFF; }
.p-cover { width: min(54%, 220px); animation: bob 6s ease-in-out infinite; }
.p-cover .cover { transform: rotate(-2deg); box-shadow: inset 5cqw 0 0 rgba(0, 0, 0, .16), inset 5.6cqw 0 0 rgba(255, 255, 255, .14), 0 30px 50px -18px rgba(0, 0, 0, .6); }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.p-tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.glass { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 14px; border-radius: 10px; background: rgba(255, 255, 255, .15); border: 1px solid rgba(255, 255, 255, .3); color: #FFFFFF; font-weight: 700; font-size: 14.5px; }
.p-titles { justify-self: stretch; display: grid; gap: 10px; }
.p-badge { justify-self: start; background: #FFFFFF; color: var(--c); font: 800 12px/1 var(--text); letter-spacing: .06em; text-transform: uppercase; padding: 6px 9px; border-radius: 6px; }
.p-titles h1 { font-size: clamp(28px, 8.8cqw, 38px); line-height: 1.05; letter-spacing: -.035em; }
.p-titles p { font-size: 16.5px; color: rgba(255, 255, 255, .9); }
.p-proof { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14.5px; color: rgba(255, 255, 255, .92); }
.p-proof > span { display: inline-flex; align-items: center; gap: 6px; }
.p-proof .stars { color: #FFD15C; }
.p-proof .stars .dim { color: rgba(255, 255, 255, .35); }
.p-by { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 14.5px; }
.mini-logo { width: 30px; height: 30px; border-radius: 8px; background: #FFFFFF; display: grid; place-items: center; }
.mini-logo .logo { width: 22px; height: 22px; }
.cert { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--ok); }
.p-hero .cert { background: #FFFFFF; color: #0D8A5E; padding: 3px 9px 3px 5px; border-radius: 999px; }
.team-logo { width: 60px; height: 60px; border-radius: 16px; background: var(--ink-soft); display: grid; place-items: center; flex: none; }
.team-logo .logo { width: 36px; height: 36px; }

/* Course trailer and video sheet */
.player { position: relative; display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; color: #FFFFFF; background: linear-gradient(135deg, color-mix(in srgb, var(--c) 70%, #000000), color-mix(in srgb, var(--c) 32%, #000000)); box-shadow: 0 24px 44px -20px rgba(0, 0, 0, .7); border: 1px solid rgba(255, 255, 255, .18); }
.player .mf { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .3; }
.player .play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; border-radius: 50%; background: #FFFFFF; color: var(--c); display: grid; place-items: center; box-shadow: 0 8px 24px rgba(0, 0, 0, .35); }
.player .play svg { margin-left: 3px; }
.player .cap { position: absolute; left: 12px; bottom: 12px; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; background: rgba(0, 0, 0, .45); padding: 5px 9px; border-radius: 7px; }
.player .vbar { position: absolute; left: 12px; right: 12px; bottom: 6px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .3); overflow: hidden; }
.player .vbar i { display: block; height: 100%; width: 0; background: #FFFFFF; }
.player.playing .vbar i { animation: vplay 24s linear forwards; }
.player.playing .cap { bottom: 16px; }
@keyframes vplay { to { width: 100%; } }

/* Facts, country, price, countdown */
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 10px 10px; display: grid; gap: 3px; align-content: start; min-width: 0; }
.fact svg { color: color-mix(in srgb, var(--c) 75%, var(--fg)); margin-bottom: 4px; }
.fact b { font: 700 17px/1.15 var(--display); letter-spacing: -.01em; }
.fact span { font-size: 12.5px; color: var(--fg-2); line-height: 1.3; }
.ctry { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 1.5px solid var(--line-2); border-radius: var(--r); background: var(--surface-2); text-align: left; }
.ctry .flag { font-size: 26px; line-height: 1; }
.ctry-t { flex: 1; min-width: 0; display: grid; }
.ctry-t b { font-size: 15.5px; }
.ctry-ch { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); font-weight: 700; font-size: 14.5px; }
.save { color: var(--ok); font-weight: 700; font-size: 15px; }
.cdown { border-radius: 14px; background: var(--marge-soft); padding: 14px; display: grid; gap: 10px; }
.cd-head { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--marge); font-size: 14.5px; }
.cd-units { display: flex; align-items: center; gap: 6px; }
.cd-units .u { flex: 1; background: var(--surface); border-radius: 10px; padding: 9px 0 7px; display: grid; justify-items: center; gap: 2px; overflow: hidden; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--marge) 18%, transparent); }
.cd-units b { display: block; font: 800 27px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--fg); }
.cd-units b.tick { animation: tick .45s var(--ease); }
@keyframes tick { from { transform: translateY(-45%); opacity: .15; } }
.cd-units i { font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); }
.cd-units .sep { font: 800 20px/1 var(--display); color: var(--marge); opacity: .55; }
.cd-bar { height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--marge) 16%, transparent); overflow: hidden; }
.cd-bar i { display: block; height: 100%; background: var(--marge); border-radius: 2px; transition: width 1s linear; }
.cd-then { font-size: 13.5px; color: var(--fg-2); }
.bb-cd { display: inline-flex; align-items: center; gap: 4px; color: var(--marge); font-weight: 700; font-variant-numeric: tabular-nums; }

/* Description, audience, programme, ratings, related */
.desc-p { font-size: 16.5px; line-height: 1.65; max-width: 62ch; }
.hl-list { display: grid; gap: 10px; }
.hl { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.hl-ic { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; color: #FFFFFF; background: linear-gradient(145deg, color-mix(in srgb, var(--c) 78%, #FFFFFF), var(--c)); box-shadow: 0 8px 18px -10px var(--c); }
.hl b { display: block; font: 700 16.5px/1.25 var(--display); margin-bottom: 2px; }
.for { display: grid; gap: 10px; }
.for-col { display: grid; gap: 10px; padding: 16px; border-radius: var(--r-card); }
.for-col.yes { background: var(--ok-soft); }
.for-col.no { background: var(--marge-soft); }
.for-col > div { display: flex; gap: 10px; align-items: flex-start; }
.for-col.yes svg { color: var(--ok); margin-top: 3px; }
.for-col.no svg { color: var(--marge); margin-top: 3px; }
.mods { display: grid; gap: 10px; }
.mod { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
.mod > button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; text-align: left; }
.mod-t { flex: 1; min-width: 0; display: grid; gap: 2px; }
.mod-t b { font: 700 16.5px/1.25 var(--display); }
.mod .pm { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; transition: transform .2s var(--ease); }
.mod[data-open="true"] .pm { transform: rotate(45deg); }
.mod .body { border-top: 1px solid var(--line); padding: 4px 16px 8px; }
.lesson { display: flex; align-items: center; gap: 10px; padding: 9px 0; font-size: 15px; border-bottom: 1px dashed var(--line); }
.lesson:last-child { border-bottom: 0; }
.lesson .nm { flex: 1; min-width: 0; }
.lesson svg { color: var(--fg-3); }
.lesson.free svg { color: var(--ok); }
button.tag-free { cursor: pointer; }
.rbars { display: grid; gap: 6px; }
.rbars > div { display: grid; grid-template-columns: 34px minmax(0, 1fr) 44px; align-items: center; gap: 10px; font-size: 13.5px; color: var(--fg-2); }
.rbars i { display: block; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.rbars i b { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
.rbars .num { text-align: right; }
.rel-rail { grid-auto-columns: 40%; }
.rel { display: grid; gap: 8px; align-content: start; text-align: left; scroll-snap-align: start; }
.rel b { font: 700 15px/1.25 var(--display); }
.rel .price { font-size: 16px; }
.prow-type .best { color: var(--ink); }

/* Quiet WhatsApp, assistant entry points */
.quiet { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; color: var(--fg-2); padding: 2px; }
.quiet .wa-mark { margin-top: 1px; }
.ask-ic { width: 38px; height: 38px; border-radius: 11px; background: var(--ink-soft); color: var(--ink); display: grid; place-items: center; flex: none; }
.ask-ic.lg { width: 52px; height: 52px; border-radius: 14px; }
.ask-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; padding: 18px; border-radius: var(--r-card); background: var(--ink-soft); }
.ask-card .btn { grid-column: 1 / -1; }
.fab { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: inline-flex; align-items: center; gap: 8px; height: 50px; padding: 0 18px 0 15px; border-radius: 25px; background: var(--fg); color: var(--bg); font-weight: 700; font-size: 15px; box-shadow: 0 10px 28px rgba(0, 0, 0, .25); transition: bottom .25s var(--ease); }
.fab.lifted { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }

/* Assistant chat */
.sheet.chat { display: flex; flex-direction: column; gap: 0; height: 88%; padding-bottom: 0; }
.chat-head { display: flex; align-items: center; gap: 12px; padding: 6px 0 12px; border-bottom: 1px solid var(--line); flex: none; }
.chat-av { width: 40px; height: 40px; border-radius: 12px; background: var(--ink-soft); display: grid; place-items: center; flex: none; }
.chat-av .logo { width: 26px; height: 26px; }
.chat-id { flex: 1; min-width: 0; display: grid; }
.chat-id .xs { color: var(--ok); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; animation: mfPulse 1.6s ease-in-out infinite; }
.chat-msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 0; display: flex; flex-direction: column; gap: 10px; }
.bub { max-width: 86%; padding: 10px 14px; border-radius: 16px; font-size: 15.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.bub.bot { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 5px; }
.bub.me { align-self: flex-end; background: var(--ink); color: var(--on-ink); border-bottom-right-radius: 5px; }
.bub.done { align-self: stretch; max-width: none; display: flex; gap: 10px; background: var(--ok-soft); }
.bub.done svg { color: var(--ok); margin-top: 3px; }
.typing { display: inline-flex; gap: 5px; align-items: center; padding: 14px; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); animation: mfPulse 1.2s ease-in-out infinite; }
.typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
.chat-more { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--fg-2); padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; }
.team-card { align-self: stretch; display: grid; gap: 10px; padding: 14px; border: 1.5px solid var(--line-2); border-radius: 14px; background: var(--surface); }
.chat-chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; scrollbar-width: none; flex: none; }
.chat-chips::-webkit-scrollbar { display: none; }
.chat-chips button { flex: none; height: 36px; padding: 0 12px; border-radius: 18px; border: 1.5px solid var(--line-2); background: var(--surface); font-weight: 700; font-size: 14px; white-space: nowrap; }
.chat-input { display: flex; gap: 8px; padding-top: 8px; flex: none; }
.chat-input input { flex: 1; min-width: 0; height: 48px; padding: 0 16px; border-radius: 24px; border: 1.5px solid var(--line-2); background: var(--surface); font-size: 16px; outline: none; }
.chat-input input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px var(--ink-soft); }
.chat-input button { width: 48px; height: 48px; border-radius: 50%; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; flex: none; }
.chat-foot { font-size: 12px; color: var(--fg-3); text-align: center; padding: 6px 0 calc(10px + env(safe-area-inset-bottom, 0px)); flex: none; }

/* Home hero: a vivid blue page with a faint exercise-book grid */
.hero2 { position: relative; overflow: hidden; color: #FFFFFF; border-radius: 0 0 28px 28px; background: radial-gradient(120% 70% at 85% 0%, var(--hero-1), transparent 60%), linear-gradient(170deg, var(--hero-2) 0%, var(--hero-3) 100%); }
.hero2::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(255, 255, 255, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .07) 1px, transparent 1px); background-size: 32px 32px; -webkit-mask-image: linear-gradient(to bottom, #000000 0%, transparent 85%); mask-image: linear-gradient(to bottom, #000000 0%, transparent 85%); }
.hero2-in { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 26px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pill-badge { justify-self: start; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .25); font-size: 13px; font-weight: 700; }
.pill-badge svg { color: var(--hero-gold); }
.hero2 h1 { font-size: clamp(34px, 10.6cqw, 48px); line-height: 1.03; letter-spacing: -.04em; font-weight: 800; }
.hero2 .u { color: #FFFFFF; }
.hero2 .u path { stroke: var(--hero-gold); }
.hero2 .lead { font-size: 17px; color: rgba(255, 255, 255, .88); max-width: 36ch; }
.hsearch { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 6px 0 16px; border-radius: 16px; background: #FFFFFF; color: #5A6075; box-shadow: 0 12px 30px -12px rgba(0, 0, 0, .45); }
.hsearch input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; color: #151A2D; }
.hsearch input::placeholder { color: #80889D; }
