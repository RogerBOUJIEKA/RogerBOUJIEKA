<title>DigiSkool Academy Bêta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: light grey canvas, large white rounded cards, floating glass header, one action colour (royal blue),
   orange reserved for promotions, dark product hero. A phone-sized column is the scroll container; a beta guide sits beside it on wide screens.
   Day / night via [data-theme] on the root (toggle in the header). */
:root {
  --bg: #EEF1F6; --surface: #FFFFFF; --surface-2: #F4F6FA; --surface-3: #E8ECF3; --line: #E1E6EE; --line-2: #D2D9E4;
  --fg: #0D1220; --fg-2: #586274; --fg-3: #8F99AB;
  --primary: #1F63FF; --primary-hover: #174FDB; --primary-soft: #E8EFFF; --on-primary: #FFFFFF;
  --promo: #FF5A1F; --on-promo: #FFFFFF;
  --success: #0F9B50; --success-soft: #E1F6EA;
  --gold: #F5B700; --star: #F5A300; --wa: #25D366; --wa-dark: #128C7E;
  --dark: #0A0F1C; --on-dark: #F4F6FB; --on-dark-2: #A4ADBF;
  --glass: rgba(22,27,40,.74); --glass-line: rgba(255,255,255,.14);
  --hero-1: #1A56F0; --hero-2: #3D7CFF; --hero-3: #A9C6FF;
  --cover-base: #0B1020;
  --shadow: 0 1px 2px rgba(13,18,32,.04), 0 10px 30px rgba(13,18,32,.06);
  --shadow-lg: 0 24px 60px rgba(13,18,32,.2);
  --font: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-read: "Literata", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07090F; --surface: #10141E; --surface-2: #161B27; --surface-3: #1D2331; --line: #222939; --line-2: #2C3446;
    --fg: #EEF1F7; --fg-2: #9CA5B6; --fg-3: #6B7488;
    --primary: #3F7DFF; --primary-hover: #5B90FF; --primary-soft: #142140; --success: #2BC370; --success-soft: #0E2A1B;
    --dark: #0D1324; --glass: rgba(26,31,45,.78); --hero-1: #0E2C80; --hero-2: #1C4FD6; --hero-3: #0F1A33;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.35); --shadow-lg: 0 24px 60px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07090F; --surface: #10141E; --surface-2: #161B27; --surface-3: #1D2331; --line: #222939; --line-2: #2C3446;
  --fg: #EEF1F7; --fg-2: #9CA5B6; --fg-3: #6B7488;
  --primary: #3F7DFF; --primary-hover: #5B90FF; --primary-soft: #142140; --success: #2BC370; --success-soft: #0E2A1B;
  --dark: #0D1324; --glass: rgba(26,31,45,.78); --hero-1: #0E2C80; --hero-2: #1C4FD6; --hero-3: #0F1A33;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.35); --shadow-lg: 0 24px 60px rgba(0,0,0,.55);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.6 var(--font); -webkit-font-smoothing: antialiased; transition: background .3s var(--ease); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--primary); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -.03em; text-wrap: balance; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-2); }
.small { font-size: 14px; }
.xs { font-size: 12.5px; }

/* Shell */
.shell { height: 100%; display: flex; justify-content: center; align-items: center; gap: 36px; }
.guide-side { display: none; }
.app { position: relative; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; transition: background .3s var(--ease); }
.scroller { position: relative; flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
@media (min-width: 1024px) {
  .shell { padding-block: 24px; }
  .app { width: 430px; height: min(900px, calc(100% - 8px)); border-radius: 40px; box-shadow: var(--shadow-lg); border: 8px solid #05070C; }
  .guide-side { display: block; width: 340px; max-height: calc(100% - 8px); overflow: auto; }
}
.wrap { padding-left: 16px; padding-right: 16px; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }

svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 16px; height: 16px; } svg.i.lg { width: 24px; height: 24px; } svg.i.xl { width: 30px; height: 30px; }

/* Promo bar + floating glass header */
.promo { background: var(--promo); color: var(--on-promo); display: flex; align-items: center; justify-content: center; gap: 10px; padding: 9px 14px; font-size: 14px; font-weight: 600; flex-wrap: wrap; text-align: center; }
@media (max-width: 380px) { .promo > span:first-child { display: none; } }
.promo .cdp { background: #FFFFFF; color: var(--promo); border-radius: 999px; padding: 3px 12px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.header { position: sticky; top: 10px; z-index: 30; margin: 10px 12px 0; display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); color: var(--on-dark); backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%); box-shadow: 0 10px 30px rgba(10,15,28,.18); }
.brand { display: flex; align-items: center; gap: 9px; color: inherit; margin-right: auto; min-width: 0; }
.mark { width: 32px; height: 32px; border-radius: 10px; background: var(--primary); color: #FFFFFF; display: grid; place-items: center; position: relative; flex: none; font: 800 18px/1 var(--font); letter-spacing: -.04em; box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }
.mark::after { content: ""; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 1.5px; background: var(--gold); }
.wordmark { font: 700 19px/1 var(--font); letter-spacing: -.045em; white-space: nowrap; }
.hbtn { width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; background: rgba(255,255,255,.08); border: 1px solid var(--glass-line); position: relative; flex: none; font-weight: 700; font-size: 13px; letter-spacing: .02em; transition: background .2s var(--ease); }
.hbtn:hover { background: rgba(255,255,255,.16); }
.hbtn .badge { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; border-radius: 999px; background: var(--primary); color: #FFFFFF; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; border: 2px solid #0D1220; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 999px; font-weight: 600; font-size: 16px; transition: transform .15s var(--ease), background .2s var(--ease), border-color .2s var(--ease); text-align: center; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 8px 20px color-mix(in srgb, var(--primary) 28%, transparent); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-soft { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.btn-ghost { border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); }
.btn-wa { background: var(--wa-dark); color: #FFFFFF; }
.btn-white { background: #FFFFFF; color: #0D1220; }
.btn-block { width: 100%; }
.btn-lg { min-height: 58px; font-size: 17px; }
.btn-up { text-transform: uppercase; letter-spacing: .02em; font-size: 15px; }
.circle-btn { width: 52px; height: 52px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); display: grid; place-items: center; flex: none; }
.link { color: var(--primary); font-weight: 600; }
.back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-2); font-weight: 500; padding-top: 22px; }

/* Sections and cards */
.section { padding-block: 26px; display: grid; gap: 16px; }
.sec-title { font-size: 28px; line-height: 1.12; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.center-head { text-align: center; display: grid; gap: 10px; justify-items: center; }
.card { background: var(--surface); border-radius: 28px; box-shadow: var(--shadow); }
.card-pad { padding: 22px; }
.tint { background: var(--surface-2); border: 1px solid var(--line); border-radius: 22px; }
.overline { font-size: 12.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.tag-pill { justify-self: start; background: var(--primary-soft); color: var(--primary); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }

/* Blue hero with presentation video */
.hero-blue { margin: -64px 10px 0; padding: 92px 16px 26px; border-radius: 0 0 34px 34px; background: linear-gradient(180deg, var(--hero-1) 0%, var(--hero-2) 50%, var(--hero-3) 100%); color: #FFFFFF; text-align: center; display: grid; gap: 16px; justify-items: center; position: relative; overflow: hidden; }
.hero-blue::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 40% at 50% 0%, rgba(255,255,255,.22), transparent 70%); pointer-events: none; }
.hero-blue > * { position: relative; }
.hero-blue h1 { font-size: 40px; line-height: 1.04; letter-spacing: -.045em; font-weight: 700; }
.hero-blue h1 span { color: #CFE0FF; }
.hero-blue p { color: rgba(255,255,255,.88); font-size: 16.5px; max-width: 34ch; }
.video { width: 100%; border-radius: 24px; padding: 6px; background: rgba(255,255,255,.28); box-shadow: 0 20px 50px rgba(10,30,90,.35); }
.video-in { position: relative; aspect-ratio: 16 / 10; border-radius: 19px; overflow: hidden; background: radial-gradient(90% 90% at 90% 110%, rgba(31,99,255,.85), transparent 70%), var(--cover-base); text-align: left; container-type: inline-size; }
.video-in::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size: 14px 14px; }
.video-in > * { position: relative; z-index: 1; }
.v-brand { position: absolute; top: 6%; left: 5.5%; display: flex; gap: 2cqw; align-items: center; font-size: 3.6cqw; font-weight: 600; }
.v-brand .mark { width: 5.6cqw; height: 5.6cqw; border-radius: 1.6cqw; font-size: 3.2cqw; }
.v-brand .mark::after { width: 1.1cqw; height: 1.1cqw; top: .8cqw; right: .8cqw; }
.v-sound { position: absolute; top: 5%; right: 4.5%; background: rgba(13,18,32,.75); border-radius: 999px; padding: 1.6cqw 3.2cqw; font-size: 3.3cqw; display: inline-flex; align-items: center; gap: 1.6cqw; }
.v-title { position: absolute; left: 5.5%; bottom: 20%; font-size: 7.4cqw; font-weight: 600; letter-spacing: -.045em; line-height: 1.02; width: 60%; }
.v-play { position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%); width: 17cqw; height: 13cqw; border-radius: 4cqw; background: var(--primary); display: grid; place-items: center; box-shadow: 0 2cqw 6cqw rgba(0,0,0,.4); }
.v-play svg { width: 45%; height: 45%; }
.v-bar { position: absolute; left: 4%; right: 4%; bottom: 6%; display: flex; align-items: center; gap: 2.4cqw; font-size: 3.2cqw; font-weight: 600; }
.v-bar i { flex: 1; height: .9cqw; border-radius: 999px; background: rgba(255,255,255,.3); position: relative; }
.v-bar i::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 18%; background: #FFFFFF; border-radius: 999px; }
.hero-blue .btn { box-shadow: 0 10px 24px rgba(10,30,90,.25); }

/* Numbered steps */
.num-card { background: var(--surface); border-radius: 24px; padding: 20px; display: flex; gap: 16px; align-items: flex-start; box-shadow: var(--shadow); }
.num-card .n { font-size: 30px; line-height: 1; color: var(--primary); font-weight: 500; letter-spacing: -.04em; flex: none; min-width: 40px; }
.num-card b { display: block; font-size: 18px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 4px; }
.num-card p { color: var(--fg-2); font-size: 15px; }
.step-card { position: relative; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); border-radius: 24px; padding: 22px; display: grid; gap: 10px; }
.step-card::after { content: attr(data-n); position: absolute; right: -6px; bottom: -22px; font-size: 96px; font-weight: 500; letter-spacing: -.06em; color: color-mix(in srgb, var(--fg) 6%, transparent); line-height: 1; }
.step-card .ic { width: 44px; height: 44px; border-radius: 14px; background: var(--primary); color: #FFFFFF; display: grid; place-items: center; }
.step-card b { font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
.step-card p { color: var(--fg-2); position: relative; z-index: 1; }
.why-grid { display: grid; gap: 10px; }
.why { background: var(--surface); border-radius: 18px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; font-size: 14.5px; }
.why .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; flex: none; }
.why b { display: block; font-size: 15px; }
.dark-band { background: #0A0C12; color: #FFFFFF; border-radius: 28px; padding: 26px 22px; display: grid; gap: 12px; }
.dark-band p { color: #A7AFBF; }

/* Segmented tabs */
.seg-tabs { display: flex; gap: 4px; background: var(--surface); border-radius: 999px; padding: 6px; overflow-x: auto; scrollbar-width: none; box-shadow: var(--shadow); }
.seg-tabs::-webkit-scrollbar { display: none; }
.seg-tabs button { flex: none; height: 44px; padding: 0 16px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; color: var(--fg-2); transition: background .25s var(--ease), color .25s var(--ease); }
.seg-tabs button[aria-pressed="true"] { background: var(--primary); color: #FFFFFF; }
.seg-tabs.dark button[aria-pressed="true"] { background: var(--fg); color: var(--surface); }
.seg-tabs .cnt { opacity: .55; }

/* Feature card with UI mockups */
.feat { padding: 12px; display: grid; gap: 4px; }
.mock { border-radius: 20px; background-color: var(--surface-2); background-image: radial-gradient(color-mix(in srgb, var(--fg-3) 30%, transparent) 1px, transparent 1px); background-size: 18px 18px; padding: 26px 18px; min-height: 230px; display: grid; place-items: center; position: relative; overflow: hidden; }
.mock::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 80% at 80% 0%, color-mix(in srgb, var(--primary) 12%, transparent), transparent 60%); }
.mock > * { position: relative; }
.mini { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; width: 100%; max-width: 280px; display: grid; gap: 10px; font-size: 13px; }
.mini-row { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; }
.mini-row.on { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
.mini-row .ck { margin-left: auto; width: 20px; height: 20px; border-radius: 999px; background: var(--success-soft); color: var(--success); display: grid; place-items: center; }
.chip-float { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font-size: 12.5px; font-weight: 600; box-shadow: var(--shadow); display: inline-flex; gap: 6px; align-items: center; }
.feat-text { padding: 18px 10px 10px; display: grid; gap: 10px; }
.feat-text h3 { font-size: 25px; line-height: 1.15; font-weight: 600; }
.feat-text p { color: var(--fg-2); font-size: 16px; }
.ln { height: 7px; border-radius: 999px; background: var(--surface-3); }
.hl { background: color-mix(in srgb, var(--gold) 30%, transparent); border-radius: 4px; padding: 1px 2px; }
.bubble { padding: 8px 11px; border-radius: 14px; max-width: 80%; font-size: 12.5px; line-height: 1.4; }
.bubble.in { background: var(--surface-2); justify-self: start; }
.bubble.out { background: var(--primary); color: #FFFFFF; justify-self: end; }
.bubble small { display: block; font-size: 10.5px; opacity: .7; margin-bottom: 2px; }

/* Promo ticket */
.ticket { background: var(--promo); color: var(--on-promo); border-radius: 28px; padding: 22px 22px 20px; display: grid; gap: 10px; position: relative; overflow: hidden; }
.ticket h3 { font-size: 26px; line-height: 1.15; font-weight: 600; }
.ticket .sep { position: relative; height: 0; border-top: 2px dashed rgba(255,255,255,.55); margin: 8px -22px; }
.ticket .sep::before, .ticket .sep::after { content: ""; position: absolute; top: -13px; width: 24px; height: 24px; border-radius: 999px; background: var(--bg); }
.ticket .sep::before { left: -12px; } .ticket .sep::after { right: -12px; }
.code-chip { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(255,255,255,.16); border: 1.5px dashed rgba(255,255,255,.7); border-radius: 999px; padding: 6px 6px 6px 18px; font-weight: 700; letter-spacing: .08em; }
.code-chip button { background: #FFFFFF; color: #0D1220; border-radius: 999px; height: 40px; padding: 0 16px; font-weight: 600; letter-spacing: 0; display: inline-flex; gap: 6px; align-items: center; }

/* Product covers: one template, colour changes per product */
.cover { --c: #1F63FF; position: relative; aspect-ratio: 16 / 10.5; border-radius: 22px; overflow: hidden; color: #FFFFFF; container-type: inline-size;
  background: radial-gradient(90% 85% at 92% 105%, color-mix(in srgb, var(--c) 80%, transparent) 0%, transparent 70%), radial-gradient(70% 60% at 0% 0%, color-mix(in srgb, var(--c) 28%, transparent), transparent 70%), var(--cover-base); }
.cover::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size: 14px 14px; -webkit-mask-image: linear-gradient(180deg, #000, transparent 85%); mask-image: linear-gradient(180deg, #000, transparent 85%); }
.cover > * { position: relative; z-index: 1; }
.cv-type { position: absolute; top: 5%; left: 5%; background: rgba(255,255,255,.95); color: #0D1220; border-radius: 999px; padding: 1.4cqw 3cqw; font-size: 3.6cqw; font-weight: 700; display: inline-flex; gap: 1.5cqw; align-items: center; z-index: 2; }
.cv-type b { width: 3.2cqw; height: 3.2cqw; border-radius: .9cqw; background: var(--c); display: inline-block; }
.cv-title { position: absolute; left: 5.5%; bottom: 17%; width: 58%; font-size: 7.4cqw; line-height: 1.04; font-weight: 600; letter-spacing: -.045em; }
.cv-pills { position: absolute; left: 5.5%; bottom: 6.5%; display: flex; gap: 1.6cqw; }
.cv-pills span { background: var(--c); border-radius: 999px; padding: .9cqw 2.2cqw; font-size: 2.6cqw; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.cv-book { position: absolute; right: 8%; top: 15%; width: 25%; aspect-ratio: 3 / 4; border-radius: .8cqw 2cqw 2cqw .8cqw; background: linear-gradient(150deg, color-mix(in srgb, var(--c) 85%, white 15%), var(--c) 55%, color-mix(in srgb, var(--c) 60%, black 40%)); transform: perspective(60cqw) rotateY(-18deg) rotate(4deg); box-shadow: -1cqw 2cqw 5cqw rgba(0,0,0,.5), inset 1.4cqw 0 0 rgba(0,0,0,.18); padding: 9%; display: flex; flex-direction: column; }
.cv-book b { font-size: 2.6cqw; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; margin-top: auto; }
.cv-book small { font-size: 1.7cqw; opacity: .85; margin-top: 4%; }
.cv-book::before { content: ""; width: 26%; height: 4%; border-radius: 1px; background: var(--gold); }
.cv-play { position: absolute; right: 12%; top: 26%; width: 17cqw; height: 17cqw; border-radius: 999px; background: rgba(255,255,255,.95); color: #0D1220; display: grid; place-items: center; box-shadow: 0 2cqw 6cqw rgba(0,0,0,.4); }
.cv-play svg { width: 40%; height: 40%; margin-left: 8%; }
.thumb { width: 56px; height: 56px; border-radius: 14px; flex: none; background: radial-gradient(80% 80% at 90% 100%, color-mix(in srgb, var(--c) 85%, transparent), transparent 75%), var(--cover-base); display: grid; place-items: center; color: #FFFFFF; }
.thumb .mark { width: 22px; height: 22px; border-radius: 7px; font-size: 12px; background: var(--c); }
.thumb .mark::after { width: 4px; height: 4px; top: 3px; right: 3px; }

/* Product cards */
.pcard { background: var(--surface); border-radius: 30px; box-shadow: var(--shadow); padding: 12px; display: grid; gap: 4px; }
.pc-cover { display: block; width: 100%; text-align: left; border-radius: 22px; }
.pc-cover .cover { transition: transform .35s var(--ease); }
.pc-cover:hover .cover { transform: scale(1.012); }
.pc-body { padding: 14px 10px 8px; display: grid; gap: 10px; }
.pc-body h3 { font-size: 22px; line-height: 1.2; letter-spacing: -.03em; font-weight: 600; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--fg-2); }

function money(x, cur = S.cur, exact = false) {
  const loc = S.lang === "fr" ? "fr-FR" : "en-US"; if (x === 0) return t("free");
  const v = x * CUR[cur].r; const f = (n, d = 0) => new Intl.NumberFormat(loc, { maximumFractionDigits: d, minimumFractionDigits: d }).format(n);
  if (cur === "XAF" || cur === "XOF") return f(exact ? v : Math.round(v / 100) * 100) + " F CFA";
  if (cur === "NGN") return "₦" + f(exact ? v : Math.round(v / 100) * 100);
  if (cur === "GHS") return "GH₵ " + f(exact ? v : Math.round(v), exact ? 2 : 0);
  if (cur === "KES") return "KSh " + f(exact ? v : Math.round(v / 10) * 10);
  return new Intl.NumberFormat(loc, { style: "currency", currency: cur }).format(exact ? v : Math.max(.99, Math.round(v) - .01));
}
