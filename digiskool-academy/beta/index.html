<title>DigiSkool Academy Bêta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: one phone-sized app column (the scroll container) + a beta guide panel beside it on wide screens.
   Tokens follow 4-CHARTE-DE-MARQUE.md. */
:root {
  --nuit-950: #071427; --nuit: #0B1F3A; --nuit-800: #12294D; --nuit-700: #16325C; --nuit-500: #2A5BA8;
  --or: #F5B700; --or-400: #FFC933; --or-600: #D99E00; --on-or: #0B1F3A; --on-dark: #FFFFFF;
  --rouge: #E11D48; --vert: #128C7E; --vert-500: #25D366; --succes: #16A34A;
  --bg: #F8FAFC; --page: #E9EEF5; --surface: #FFFFFF; --surface-2: #F1F5F9;
  --fg: #0F172A; --fg-2: #475569; --fg-3: #94A3B8; --line: #E2E8F0;
  --nuit-soft: #E6EEF9; --or-soft: #FFF6D6; --rouge-soft: #FFE4E9; --vert-soft: #E9FBF0; --succes-fg: #15803D;
  --shadow-1: 0 1px 2px rgba(11,31,58,.06), 0 4px 12px rgba(11,31,58,.06);
  --shadow-2: 0 10px 30px rgba(11,31,58,.18);
  --font-display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --font-ui: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-read: "Literata", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(.2,.8,.2,1);
  --aube: linear-gradient(135deg, #071427 0%, #0B1F3A 45%, #16325C 75%, #2A5BA8 100%);
  --trame: repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 2px, transparent 2px 16px), repeating-linear-gradient(-45deg, rgba(255,255,255,.05) 0 2px, transparent 2px 16px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #071427; --page: #040C18; --surface: #0B1F3A; --surface-2: #12294D;
    --fg: #F1F5F9; --fg-2: #B6C2D3; --fg-3: #7C8BA1; --line: #1B3763;
    --nuit-soft: #12294D; --or-soft: #2B2408; --rouge-soft: #3A0C1C; --vert-soft: #0A2E2A; --succes-fg: #4ADE80;
    --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3); --shadow-2: 0 10px 30px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #071427; --page: #040C18; --surface: #0B1F3A; --surface-2: #12294D;
  --fg: #F1F5F9; --fg-2: #B6C2D3; --fg-3: #7C8BA1; --line: #1B3763;
  --nuit-soft: #12294D; --or-soft: #2B2408; --rouge-soft: #3A0C1C; --vert-soft: #0A2E2A; --succes-fg: #4ADE80;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3); --shadow-2: 0 10px 30px rgba(0,0,0,.5);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--page); color: var(--fg); font: 400 16px/1.55 var(--font-ui); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* Shell */
.shell { height: 100%; display: flex; justify-content: center; align-items: center; gap: 32px; }
.guide-side { display: none; }
.app { position: relative; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
.scroller { position: relative; flex: 1; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
@media (min-width: 1024px) {
  .shell { padding-block: 24px; }
  .app { width: 430px; height: min(900px, calc(100% - 8px)); border-radius: 36px; box-shadow: var(--shadow-2); border: 8px solid var(--nuit-950); }
  .guide-side { display: block; width: 330px; max-height: calc(100% - 8px); overflow: auto; }
}
.wrap { padding-left: 16px; padding-right: 16px; }

/* Promo bar + header */
.promo { background: var(--rouge); color: var(--on-dark); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 16px; }
.promo .txt { flex: 1; min-width: 0; }
.promo .copy { border: 1.5px solid rgba(255,255,255,.8); border-radius: 999px; padding: 3px 10px; font-size: 12px; white-space: nowrap; }
.promo .x { opacity: .85; display: grid; place-items: center; width: 28px; height: 28px; }
.header { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.logo { display: flex; align-items: center; gap: 8px; color: var(--fg); text-decoration: none; }
.logo svg { width: 30px; height: 30px; color: var(--nuit); }
:root[data-theme="dark"] .logo svg { color: var(--on-dark); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo svg { color: var(--on-dark); } }
.wm { display: flex; flex-direction: column; line-height: 1; }
.wm b { font: 800 17px/1 var(--font-display); letter-spacing: -.02em; position: relative; white-space: nowrap; }
.header { gap: 6px; }
.header .chip-btn { padding: 0 8px; gap: 3px; }
.header .lang button { padding: 0 8px; }
@media (max-width: 440px) { .header.has-back .wm { display: none; } .header .chip-btn svg { display: none; } }
.r-top .lang button[aria-pressed="true"] { color: var(--on-dark); opacity: 1; }
.sheet:focus { outline: none; }
.wm .ipix { position: relative; display: inline-block; }
.wm .ipix i { position: absolute; left: 50%; top: -1px; width: 4.5px; height: 4.5px; background: var(--or); transform: translateX(-50%); border-radius: 1px; }
.wm small { font: 600 7.5px/1 var(--font-display); letter-spacing: .32em; color: var(--fg-2); margin-top: 3px; }
.h-spacer { flex: 1; }
.chip-btn { display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; white-space: nowrap; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; height: 34px; }
.lang button { padding: 0 9px; font-size: 12px; font-weight: 700; color: var(--fg-2); }
.lang button[aria-pressed="true"] { background: var(--nuit); color: var(--on-dark); }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 999px; position: relative; }
.icon-btn .dot { position: absolute; top: 3px; right: 2px; min-width: 16px; height: 16px; border-radius: 999px; background: var(--rouge); color: var(--on-dark); font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
.beta-pill { font: 700 10px/1 var(--font-ui); letter-spacing: .08em; background: var(--or); color: var(--on-or); padding: 5px 7px; border-radius: 6px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 16px; height: 16px; } svg.i.lg { width: 26px; height: 26px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 12px; font-weight: 600; transition: transform .15s var(--ease), background .15s var(--ease); text-decoration: none; }
.btn:active { transform: scale(.98); }
.btn-buy { background: var(--or); color: var(--on-or); font-weight: 700; min-height: 56px; font-size: 17px; letter-spacing: .01em; }
.btn-buy:hover { background: var(--or-400); }
.btn-dark { background: var(--nuit); color: var(--on-dark); }
:root[data-theme="dark"] .btn-dark { background: var(--nuit-500); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-dark { background: var(--nuit-500); } }
.btn-line { border: 1.5px solid var(--line); background: var(--surface); }
.btn-wa { background: var(--vert); color: var(--on-dark); }
.btn-block { width: 100%; }
.link { color: var(--nuit-500); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
:root[data-theme="dark"] .link { color: var(--or-400); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .link { color: var(--or-400); } }

/* Sections */
.section { padding-block: 22px; display: grid; gap: 14px; }
.section + .section { border-top: 1px solid var(--line); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-head h2 { font-size: 20px; }
.overline { font: 600 11px/1.3 var(--font-ui); letter-spacing: .09em; text-transform: uppercase; color: var(--fg-2); }
.muted { color: var(--fg-2); }
.small { font-size: 13px; }

/* Hero */
.hero { background: var(--aube); color: var(--on-dark); position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0; background: var(--trame); pointer-events: none; }
.hero-in { position: relative; padding-block: 28px 26px; display: grid; gap: 14px; }
.hero h1 { font-size: 34px; line-height: 1.08; font-weight: 800; }
.hero h1 em { font-style: normal; color: var(--or); }
.hero p { color: rgba(255,255,255,.82); }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); color: var(--fg); border-radius: 12px; padding: 0 12px; height: 48px; border: 1px solid var(--line); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; height: 100%; }
.search-results { background: var(--surface); color: var(--fg); border-radius: 12px; box-shadow: var(--shadow-2); overflow: hidden; }
.search-results button { display: flex; width: 100%; gap: 10px; align-items: center; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); }
.hero-cta { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: rgba(255,255,255,.85); }
.hero-stats b { color: var(--on-dark); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--nuit); color: var(--on-dark); border-color: var(--nuit); }

/* Cover (same template, colour changes per product) */
.cover { --c: #4338CA; container-type: inline-size; position: relative; aspect-ratio: 3 / 4; width: 100%; border-radius: 10px; overflow: hidden; color: var(--on-dark);
  background: var(--trame), linear-gradient(160deg, color-mix(in srgb, var(--c) 92%, white 8%) 0%, var(--c) 45%, color-mix(in srgb, var(--c) 62%, black 38%) 100%);
  display: flex; flex-direction: column; padding: 9% 9% 8%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.cover::after { content: ""; position: absolute; right: -18%; bottom: -14%; width: 70%; aspect-ratio: 1; border: 10px solid rgba(255,255,255,.07); transform: rotate(45deg); }
.cover .ct { display: flex; justify-content: space-between; align-items: center; font: 700 4.6cqw/1 var(--font-ui); letter-spacing: .14em; opacity: .92; }
.cover .ct svg { width: 1.9em; height: 1.9em; color: var(--on-dark); }
.cover .cti { font: 800 11cqw/1.08 var(--font-display); margin-top: auto; text-wrap: balance; position: relative; z-index: 1; }
.cover .csu { font-size: 5.6cqw; opacity: .85; margin-top: .5em; line-height: 1.3; position: relative; z-index: 1; }
.cover .cb { display: flex; justify-content: space-between; align-items: center; margin-top: 10%; font-size: 4.6cqw; font-weight: 600; position: relative; z-index: 1; }
.cover .lg { background: rgba(255,255,255,.18); border-radius: 4px; padding: 3px 5px; letter-spacing: .08em; }
.cover .tome { position: absolute; top: 18%; right: 9%; font: 800 20cqw/1 var(--font-display); color: var(--or); opacity: .95; }

/* Product cards */
.row-scroll { display: grid; grid-auto-flow: column; grid-auto-columns: 46%; gap: 12px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; scroll-snap-type: x mandatory; }
.row-scroll::-webkit-scrollbar { display: none; }
.row-scroll > * { scroll-snap-align: start; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
.card { display: grid; gap: 6px; text-align: left; align-content: start; min-width: 0; }
.card .cv { position: relative; font-size: 15px; transition: transform .25s var(--ease); }
.card:hover .cv { transform: translateY(-3px); }
.tag { position: absolute; z-index: 2; font: 700 11px/1 var(--font-ui); padding: 5px 7px; border-radius: 999px; }
.tag.promo-t { top: 8px; left: 8px; background: var(--rouge); color: var(--on-dark); }
.tag.best { top: 8px; right: 8px; background: var(--or); color: var(--on-or); box-shadow: 0 0 0 4px rgba(245,183,0,.25); }
.tag.new { top: 8px; right: 8px; background: var(--nuit); color: var(--on-dark); }
.tag.free { top: 8px; left: 8px; background: var(--succes); color: var(--on-dark); }
.tag.soon { top: 8px; left: 8px; background: var(--nuit-950); color: var(--or); }
.card h3 { font-size: 15px; line-height: 1.25; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { font-size: 12.5px; color: var(--fg-2); display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: center; }
.stars { color: var(--or-600); font-weight: 700; display: inline-flex; align-items: center; gap: 2px; }
.price-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.price { font: 800 16px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.was { color: var(--fg-3); text-decoration: line-through; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.mini-cd { font-size: 12px; font-weight: 600; color: var(--rouge); display: inline-flex; gap: 4px; align-items: center; }

/* Steps, benefits */
.steps { display: grid; gap: 10px; }
.step { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.step .n { width: 34px; height: 34px; border-radius: 999px; background: var(--or); color: var(--on-or); font: 800 15px/34px var(--font-display); text-align: center; flex: none; }
.benefits { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.benefit { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 6px; font-size: 13.5px; }
.duo { width: 36px; height: 36px; border-radius: 10px; background: var(--nuit-soft); display: grid; place-items: center; color: var(--nuit-500); }
:root[data-theme="dark"] .duo { color: var(--or); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .duo { color: var(--or); } }
.benefit b { font-family: var(--font-display); font-size: 14.5px; }

/* Testimonials, author, community, forms */
.tcards { display: grid; grid-auto-flow: column; grid-auto-columns: 84%; gap: 12px; overflow-x: auto; scrollbar-width: none; }
.tcards::-webkit-scrollbar { display: none; }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; font-size: 14px; }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.avatar { width: 34px; height: 34px; border-radius: 999px; background: var(--nuit); color: var(--or); display: grid; place-items: center; font: 800 13px/1 var(--font-display); flex: none; }
.verified { color: var(--succes-fg); font-weight: 600; font-size: 12px; display: inline-flex; align-items: center; gap: 3px; }
.author { display: flex; gap: 14px; align-items: center; }
.author .avatar { width: 64px; height: 64px; font-size: 20px; }
.wa-card { background: var(--vert-soft); border: 1.5px solid color-mix(in srgb, var(--vert) 45%, transparent); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.wa-card .sup { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.wa-ic { width: 36px; height: 36px; border-radius: 999px; background: var(--vert-500); color: var(--on-dark); display: grid; place-items: center; flex: none; }
.wa-num { font-weight: 700; font-variant-numeric: tabular-nums; user-select: all; }
.wa-mini { display: flex; gap: 10px; align-items: center; background: var(--vert-soft); border: 1px solid color-mix(in srgb, var(--vert) 40%, transparent); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; width: 100%; text-align: left; }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; }
.field .hint { font-size: 12.5px; color: var(--fg-2); }
.input { height: 50px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); padding: 0 14px; width: 100%; outline: none; }
.input:focus { border-color: var(--nuit-500); }
.input.err { border-color: var(--rouge); }
.err-msg { color: var(--rouge); font-size: 13px; font-weight: 500; }
.phone { display: flex; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); height: 50px; overflow: hidden; }
.phone select { border: 0; background: var(--surface-2); padding: 0 8px; font-weight: 600; outline: none; }
.phone input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 0 12px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.phone:focus-within { border-color: var(--nuit-500); }
.acc { border-bottom: 1px solid var(--line); }
.acc > button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; text-align: left; font-weight: 600; }
.acc > button svg { transition: transform .2s var(--ease); }
.acc[data-open="true"] > button svg { transform: rotate(180deg); }
.acc .body { padding: 0 0 14px; color: var(--fg-2); font-size: 14.5px; }
.footer { background: var(--nuit-950); color: rgba(255,255,255,.75); font-size: 13px; padding-block: 24px 28px; display: grid; gap: 12px; }
.footer b { color: var(--on-dark); }
.footer .logo svg { color: var(--on-dark); }
.noanim, .noanim .sheet { animation: none !important; }
.pay-logos { display: flex; flex-wrap: wrap; gap: 6px; }
.pl { height: 26px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; font: 800 11px/1 var(--font-ui); letter-spacing: .02em; }
.pl.mtn { background: #FFCC00; color: #1A1A1A; } .pl.orange { background: #FF7900; color: #FFFFFF; }
.pl.visa { background: #1A1F71; color: #FFFFFF; font-style: italic; } .pl.mc { background: #222222; color: #FFFFFF; }
.pl.wave { background: #1DC8FF; color: #0B1F3A; } .pl.moov { background: #0066B3; color: #FFFFFF; } .pl.bank { background: var(--surface-2); color: var(--fg); }

/* Product page */
.p-hero { background: var(--aube); color: var(--on-dark); position: relative; overflow: hidden; }
.p-hero::before { content: ""; position: absolute; inset: 0; background: var(--trame); }
.p-hero-in { position: relative; padding-block: 20px 22px; display: grid; justify-items: center; gap: 12px; }
.book3d { width: 58%; max-width: 220px; perspective: 900px; position: relative; }
.book3d .cover { transform: rotateY(-16deg); box-shadow: 18px 18px 30px rgba(0,0,0,.45); font-size: 22px; border-radius: 4px 10px 10px 4px; }
.book3d .cover::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7%; background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(255,255,255,.08), transparent); z-index: 3; }
.book3d .tag { z-index: 4; }
.p-actions-top { display: flex; gap: 8px; }
.ghost-light { color: var(--on-dark); border: 1.5px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.p-info { display: grid; gap: 10px; padding-block: 16px 18px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font: 700 11px/1 var(--font-ui); padding: 6px 8px; border-radius: 999px; letter-spacing: .03em; }
.badge.best { background: var(--or); color: var(--on-or); }
.badge.upd { background: var(--nuit-soft); color: var(--fg); }
.p-info h1 { font-size: 27px; line-height: 1.12; font-weight: 800; }
.p-sub { color: var(--fg-2); }
.pricebox { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow-1); }
.big-price { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.big-price .price { font-size: 34px; }
.pct { background: var(--rouge); color: var(--on-dark); font: 800 13px/1 var(--font-ui); padding: 6px 8px; border-radius: 999px; }
.save { color: var(--succes-fg); font-weight: 600; font-size: 14.5px; }
.conv { width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--fg-2); }

const CUR = {
  XAF: { r: 1, fl: "🇨🇲", n: { fr: "Franc CFA (CEMAC)", en: "CFA franc (CEMAC)" } },
  XOF: { r: 1, fl: "🇨🇮", n: { fr: "Franc CFA (UEMOA)", en: "CFA franc (WAEMU)" } },
  NGN: { r: 2.65, fl: "🇳🇬", n: { fr: "Naira", en: "Naira" } },
  GHS: { r: 0.0245, fl: "🇬🇭", n: { fr: "Cedi", en: "Cedi" } },
  KES: { r: 0.228, fl: "🇰🇪", n: { fr: "Shilling kényan", en: "Kenyan shilling" } },
  EUR: { r: 1 / 655.957, fl: "🇪🇺", n: { fr: "Euro", en: "Euro" } },
  USD: { r: 1 / 565, fl: "🇺🇸", n: { fr: "Dollar US", en: "US dollar" } }
};
function money(xaf, cur = S.cur, exact = false) {
  const loc = S.lang === "fr" ? "fr-FR" : "en-US";
  if (xaf === 0) return t("free");
  let v = xaf * CUR[cur].r;
  if (cur === "XAF" || cur === "XOF") {
    if (!exact) v = Math.round(v / 100) * 100;
    return new Intl.NumberFormat(loc, { maximumFractionDigits: 0 }).format(v) + " FCFA";
  }
  if (cur === "NGN") return "₦" + new Intl.NumberFormat(loc, { maximumFractionDigits: 0 }).format(exact ? v : Math.round(v / 100) * 100);
  if (cur === "GHS") return "GH₵ " + new Intl.NumberFormat(loc, { maximumFractionDigits: exact ? 2 : 0 }).format(exact ? v : Math.round(v));
  if (cur === "KES") return "KSh " + new Intl.NumberFormat(loc, { maximumFractionDigits: 0 }).format(exact ? v : Math.round(v / 10) * 10);
  const val = exact ? v : Math.max(0.99, Math.round(v) - 0.01);
  return new Intl.NumberFormat(loc, { style: "currency", currency: cur }).format(val);
}
const pct = p => Math.round((1 - p.promo / p.base) * 100);

  });

}
function markMethods() {
  layer.querySelectorAll(".method").forEach(b => { const on = b.dataset.m === S.method; b.setAttribute("aria-pressed", on); const ok = b.querySelector(".ok");
    if (on && !ok) b.insertAdjacentHTML("afterbegin", `<span class="ok">${ic("check", "sm")}</span>`); if (!on && ok) ok.remove(); });

function keepForm() { const n = $("#coName"), ph = $("#coPhone"); if (n) S.lastName = n.value; if (ph) S.lastPhone = ph.value; }
function refreshMethods() { keepForm(); const em = $("#coEmail"); const ev = em ? em.value : ""; const sc = layer.querySelector(".sheet").scrollTop; S._noAnim = true; sheetCheckout(); const e2 = $("#coEmail"); if (e2) e2.value = ev; layer.querySelector(".sheet").scrollTop = sc; }

let waitTimer = null, autoTimer = null;
function startWaiting() {
  let secs = 179; clearInterval(waitTimer); clearTimeout(autoTimer);
  waitTimer = setInterval(() => { secs = Math.max(0, secs - 1); const e = $("#expiry"); if (e) e.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`; }, 1000);
  autoTimer = setTimeout(() => { if (S.view === "attente") paid(); }, 7000);
}
function paid() {
  clearInterval(waitTimer); clearTimeout(autoTimer);
  const items = S.checkoutItems || [S.pid];
  items.forEach(id => { if (!S.owned.includes(id)) S.owned.push(id); });
  S.cart = S.cart.filter(id => !items.includes(id)); store.set("cart", S.cart); store.set("owned", S.owned);
  S.pid = items[0]; S.checkoutItems = null; S.bump = false; S.coupon = null; go("succes");
}

/* ---------- Confetti (gold pixels, brand motif) ---------- */
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const app = $("#app"); const c = document.createElement("canvas"); c.className = "confetti"; app.appendChild(c);
  const r = app.getBoundingClientRect(); const dpr = Math.min(2, devicePixelRatio || 1); c.width = r.width * dpr; c.height = r.height * dpr; const g = c.getContext("2d"); g.scale(dpr, dpr);
  const cols = ["#F5B700", "#FFC933", "#D99E00", "#FFFFFF"];
  const parts = Array.from({ length: 70 }, () => ({ x: r.width / 2 + (Math.random() - .5) * 80, y: r.height * .28, vx: (Math.random() - .5) * 7, vy: -Math.random() * 7 - 3, s: 4 + Math.random() * 5, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6 }));
  let f = 0; (function tick() { g.clearRect(0, 0, r.width, r.height); parts.forEach(p => { p.vy += .22; p.x += p.vx; p.y += p.vy; p.a += .1; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s); g.restore(); }); if (++f < 110) requestAnimationFrame(tick); else c.remove(); })();
}

/* ---------- Toasts (popup manager: max 4, spaced, never on excluded screens) ---------- */
function toast(html, opts = {}) {
  const el = document.createElement("div"); el.className = "toast" + (opts.info ? " info" : ""); el.innerHTML = html + (opts.info ? "" : '<span class="pbar"></span>');
  if (opts.id) el.dataset.a = "open", el.dataset.id = opts.id, el.style.cursor = "pointer";
  toasts.innerHTML = ""; toasts.appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .3s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 300); }, opts.info ? 2600 : 6000);
}
const info = msg => toast(`<span class="tx">${msg}</span>`, { info: true });
function marketingToast(kind) {
  if (S.toastsShown >= 4) return true;
  if (EXCLUDE_POPUPS.includes(S.view) || layer.innerHTML) return false;
  S.toastsShown++;
  if (kind === "new") toast(`${cover(byId("canva"), { sub: false })}<span class="tx"><b>${t("toastNew")}</b><br>${t("toastNewS")} · ${money(5500)}</span><button class="close" data-a="dismissToast" aria-label="Fermer" style="width:32px;height:32px;margin:0">${ic("x", "sm")}</button>`, { id: "canva" });
  if (kind === "buy") toast(`${cover(byId("vendre"), { sub: false })}<span class="tx">${t("toastBuy")}<br><span class="muted">${t("ago")}</span></span>`, { id: "vendre" });
  if (kind === "left") toast(`<span class="wa-ic" style="background:var(--rouge)">${ic("clock")}</span><span class="tx"><b>${t("toastLeft")}</b><br><span class="num">${cdText(S.promoEnd)}</span></span>`, {});
  return true;
}
function schedule(fn, ms) { setTimeout(function tryIt() { if (!fn()) setTimeout(tryIt, 5000); }, ms); }
schedule(() => {
  if (S.modalShown) return true;
  if (EXCLUDE_POPUPS.includes(S.view) || layer.innerHTML || !["accueil", "boutique", "produit"].includes(S.view)) return false;
  S.modalShown = true; store.set("modalShown", true); sheetOffer(); return true;
}, 8000);
schedule(() => marketingToast("new"), 16000);
schedule(() => marketingToast("buy"), 34000);
schedule(() => marketingToast("left"), 55000);

/* ---------- Countdown ticker ---------- */
setInterval(() => {
  document.querySelectorAll("[data-cd]").forEach(el => { const end = +el.dataset.cd; el.textContent = el.dataset.days ? daysText(end) : cdText(end); });
  document.querySelectorAll("[data-cdb]").forEach(el => { const [h, m, s] = cdParts(+el.dataset.cdb); const b = el.querySelectorAll("b"); b[0].textContent = h; b[1].textContent = m; b[2].textContent = s; });
  if (S.reader.playing) { S.reader.prog = Math.min(100, S.reader.prog + 0.4); const a = $("#aprog"); if (a) a.style.width = S.reader.prog + "%"; }
}, 1000);

/* ---------- Guide ---------- */
function guideHtml(inSheet) {
  const fr = S.lang === "fr";
  const steps = fr ? [["accueil", "Accueil : barre promo, chrono, carrousels"], ["produit", "Page produit e-book (feuilleter, avis, valeur)"], ["buy", "Payer en 3 champs avec MTN MoMo"], ["mes-produits", "Mes produits après l’achat"], ["liseuse", "Liseuse : FR ⇄ EN, Aa, citation, audio"], ["acces", "Retrouver mon achat par numéro"], ["offer", "Voir le popup « Offre spéciale »"], ["communaute", "Communauté WhatsApp"]]
    : [["accueil", "Home: promo bar, countdown, carousels"], ["produit", "E-book product page (preview, reviews, value)"], ["buy", "Pay in 3 fields with MTN MoMo"], ["mes-produits", "My products after purchase"], ["liseuse", "Reader: EN ⇄ FR, Aa, quote, audio"], ["acces", "Find my purchase by number"], ["offer", "See the “Special offer” popup"], ["communaute", "WhatsApp community"]];

    <p>${fr ? "Version bêta cliquable de la plateforme, construite à partir du cahier des charges, de la charte et des maquettes. Testez-la comme un client." : "Clickable beta of the platform, built from the specification, brand guide and wireframes. Try it like a customer would."}</p>

}
function renderGuide() { const g = $("#guideSide"); if (getComputedStyle(g).display !== "none") g.innerHTML = `<div class="guide-card">${guideHtml(false)}</div>`; }

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a;
  if (a === "closeSheet" && e.target.closest("[data-stop]") && el.classList.contains("overlay")) return;
  switch (a) {
    case "go": closeSheet(); go(el.dataset.v); break;
    case "back": go(S.view === "produit" ? (S.prev || "accueil") : "accueil"); break;
    case "open": closeSheet(); S.prev = S.view === "produit" ? "accueil" : S.view; S.pid = el.dataset.id; S.reader.lang = null; go("produit"); break;
    case "lang": S.lang = el.dataset.l; store.set("lang", S.lang); render(true); break;
    case "currency": sheetCurrency(); break;
    case "setCur": S.cur = el.dataset.c; store.set("cur", S.cur); closeSheet(); render(true); info(`${CUR[S.cur].fl} ${S.cur}`); break;
    case "convert": sheetConvert(); break;
    case "closeSheet": closeSheet(); break;
    case "closePromo": S.promoBar = false; render(true); break;
    case "copy": try { navigator.clipboard.writeText("DIGI45").then(() => info(t("copied") + " : DIGI45"), () => info("DIGI45")); } catch (err) { info("DIGI45"); } break;
    case "guide": sheetGuide(); break;
    case "journey": {
      const k = el.dataset.k; closeSheet();
      if (k === "buy") { S.pid = "vendre"; go("produit"); setTimeout(() => { S.checkoutItems = null; sheetCheckout(); }, 250); }
      else if (k === "liseuse") { S.pid = "vendre"; if (!S.owned.includes("vendre")) { S.owned.push("vendre"); store.set("owned", S.owned); } go("liseuse"); }
      else if (k === "offer") { go("accueil"); setTimeout(sheetOffer, 200); }
      else if (k === "produit") { S.pid = "vendre"; go("produit"); }
      else go(k);
      break;
    }
    case "cat": el.parentElement.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === el)); break;
    case "filter": S.filter = el.dataset.f; render(true); break;
    case "acc": { const box = el.parentElement; const open = box.dataset.open !== "true"; box.dataset.open = open; box.querySelector(".body").hidden = !open; break; }
    case "toc": { const more = document.querySelectorAll("[data-more]"); const show = more[0] && more[0].hidden; more.forEach(r => r.hidden = !show); el.textContent = show ? t("collapse") : t("expand"); break; }
    case "tab": { const tgt = document.getElementById(el.dataset.t); if (tgt) scroller.scrollTo({ top: tgt.offsetTop - 110, behavior: "smooth" }); el.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", b === el)); break; }
    case "buy": { const p = byId(S.pid); if (p.free) { S.checkoutItems = null; S.owned.includes(p.id) || S.owned.push(p.id); store.set("owned", S.owned); go("succes"); break; } S.checkoutItems = null; sheetCheckout(); break; }
    case "buyFromFlip": closeSheet(); S.pid = "vendre"; S.checkoutItems = null; sheetCheckout(); break;
    case "buyCart": S.checkoutItems = S.cart.slice(); if (!S.checkoutItems.length) break; S.pid = S.checkoutItems[0]; sheetCheckout(); break;
    case "addcart": { const id = S.pid; if (!S.cart.includes(id)) S.cart.push(id); if (el.textContent.trim() === t("addPack") && !S.cart.includes("whatsapp")) S.cart.push("whatsapp"); store.set("cart", S.cart); render(true); info(`✓ ${t("addedCart")}`); break; }
    case "cart": sheetCart(); break;
    case "bump": keepForm(); S.bump = !S.bump; refreshMethods(); break;
    case "method": keepForm(); S.method = el.dataset.m; refreshMethods(); break;
    case "fixEmail": { const em = $("#coEmail"); em.value = em.value.replace(/@.*$/, "@gmail.com"); $("#emailHint").textContent = t("emailHint"); break; }
    case "coupon": { const v = ($("#coupon").value || "").trim().toUpperCase(); const msg = $("#couponMsg"); if (v === "AMI10") { keepForm(); S.coupon = "AMI10"; refreshMethods(); info(t("codeOk")); } else { msg.textContent = t("codeBad"); msg.style.color = "var(--rouge)"; } break; }
    case "pay": {
      const n = $("#coName"), ph = $("#coPhone"); let ok = true;
      $("#errName").hidden = !!n.value.trim(); n.classList.toggle("err", !n.value.trim()); if (!n.value.trim()) ok = false;
      const digits = ph.value.replace(/\D/g, ""); const phoneOk = S.phoneCountry === "CM" ? /^6\d{8}$/.test(digits) : digits.length >= 8;
      $("#errPhone").hidden = phoneOk; if (!phoneOk) ok = false;
      if (!ok) break;
      S.lastName = n.value.trim(); S.lastPhone = ph.value.trim(); closeSheet();
      if (["mtn", "orange", "wave", "moov"].includes(S.method)) go("attente");
      else { info(S.lang === "fr" ? "Paiement par carte sécurisé… (simulé)" : "Secure card payment… (simulated)"); setTimeout(paid, 1600); }
      break;
    }
    case "confirm": paid(); break;
    case "ussd": { const u = $("#ussd"); u.hidden = !u.hidden; break; }
    case "changeMethod": clearInterval(waitTimer); clearTimeout(autoTimer); S.view = "produit"; render(); sheetCheckout(); break;
    case "read": { S.pid = el.dataset.id; if (!S.owned.includes(S.pid)) { S.owned.push(S.pid); store.set("owned", S.owned); } S.reader.lang = el.dataset.rl || null; S.reader.playing = !!el.dataset.audio; go("liseuse"); break; }
    case "rlang": S.reader.lang = el.dataset.l; render(true); break;
    case "rsettings": sheetReaderSettings(); break;
    case "rsize": S.reader.size = +el.dataset.s; render(true); S._noAnim = true; sheetReaderSettings(); break;
    case "rfont": S.reader.font = el.dataset.f; render(true); S._noAnim = true; sheetReaderSettings(); break;
    case "rtheme": S.reader.theme = el.dataset.th; render(true); S._noAnim = true; sheetReaderSettings(); break;
    case "play": S.reader.playing = !S.reader.playing; el.innerHTML = ic(S.reader.playing ? "pause" : "play"); break;
    case "exo": { const on = el.getAttribute("aria-pressed") !== "true"; el.setAttribute("aria-pressed", on); break; }
    case "quote": sheetQuote(decodeURIComponent(el.dataset.q)); break;
    case "copyQuote": { const q = decodeURIComponent(el.dataset.q); try { navigator.clipboard.writeText(q).then(() => info("✓"), () => info(q)); } catch (err) { info(q); } break; }
    case "flip": sheetFlip(); break;
    case "flipNext": S._flip && S._flip.next(); break;
    case "flipPrev": S._flip && S._flip.prev(); break;
    case "sample": info(S.lang === "fr" ? "🎧 Extrait audio de 30 s (simulé dans la bêta)" : "🎧 30-second audio sample (simulated in the beta)"); break;
    case "offerGo": closeSheet(); S.filter = "deals"; go("boutique"); break;
    case "fab": sheetFab(); break;
    case "community": closeSheet(); info(t("demoLink")); break;
    case "support": closeSheet(); info(t("demoSupport")); break;
    case "notify": S.notified = true; render(true); info(t("notified")); break;
    case "lead": info(S.lang === "fr" ? "✓ E-book gratuit envoyé sur WhatsApp (simulé)" : "✓ Free e-book sent to WhatsApp (simulated)"); break;
    case "sendCode": {
      const z = $("#codeZone"); z.hidden = false; const boxes = [...document.querySelectorAll("#codeBoxes span")]; const code = "482913";
      boxes.forEach((b, i) => setTimeout(() => { b.textContent = code[i]; b.classList.add("f"); if (i === 5) setTimeout(() => { if (!S.owned.includes("vendre")) { S.owned.push("vendre"); store.set("owned", S.owned); } info(S.lang === "fr" ? "✓ Accès accordé" : "✓ Access granted"); go("mes-produits"); }, 700); }, 600 + i * 180));
      break;
    }
    case "dismissToast": e.stopPropagation(); toasts.innerHTML = ""; return;
    case "toast-demo": info(S.lang === "fr" ? "Fonction prévue dans la version finale (simulée ici)." : "Planned for the final version (simulated here)."); break;
    case "toast-audio": info(S.lang === "fr" ? "🔊 Guide audio de 30 s (simulé)" : "🔊 30-second audio guide (simulated)"); break;
    case "toast-mark": info(S.lang === "fr" ? "🔖 Marque-page ajouté" : "🔖 Bookmark added"); break;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && layer.innerHTML) closeSheet(); });
layer.addEventListener("click", e => { if (e.target.classList.contains("overlay") && e.target.dataset.a === "closeSheet") closeSheet(); }, true);
window.addEventListener("resize", renderGuide);

/* ---------- Boot ---------- */
const h = (location.hash || "").replace("#", "");
const allowed = ["accueil", "boutique", "produit", "mes-produits", "acces", "communaute"];
if (allowed.includes(h)) S.view = h;
window.addEventListener("hashchange", () => { const v = location.hash.replace("#", ""); if (allowed.includes(v) && v !== S.view) go(v); });
render();
})();
