<title>DigiSkool Academy Bêta</title>

<style>
/* Concept "cahier et ardoise".
   Day: a school exercise book. Cool white paper, fountain-pen blue ink for every action, the red margin line for prices on
   promotion and deadlines only, Seyès ruling on the opening page only, covers that look like labelled notebooks
   (same design, one colour per product). Night: the classroom slate.
   Type: Bricolage Grotesque for titles and prices, Atkinson Hyperlegible Next for reading the interface (built for legibility),
   Literata for the books themselves. Layout: one phone-width column, left-aligned, quiet cards with borders instead of shadows. */
:root {
  --bg: #F5F6FA; --surface: #FFFFFF; --surface-2: #EEF0F6; --line: #E0E4ED; --line-2: #C9CFDC;
  --fg: #151A2D; --fg-2: #4C5469; --fg-3: #80889D;
  --ink: #2A3CC4; --ink-hover: #1F2EA3; --ink-soft: #E8EBFA; --on-ink: #FFFFFF;
  --marge: #D3344A; --marge-soft: #FBEAEC; --on-marge: #FFFFFF;
  --ok: #0D8A5E; --ok-soft: #E2F3EB; --on-ok: #FFFFFF;
  --gold: #D99A06; --wa: #25D366; --on-wa: #08311F; --wa-icon: #FFFFFF;
  --rule: rgba(42, 60, 196, .04); --rule-2: rgba(42, 60, 196, .085); --margin-line: rgba(211, 52, 74, .5);
  --label: #FFFFFF; --cover-ink: #151A2D; --cover-meta: #5A6075; --cover-rule: #E2E5EE;
  --page: #FFFFFF; --page-ink: #2B3142; --sepia-bg: #F5EEDF; --sepia-fg: #3A2F1F; --night-bg: #0E1412; --night-fg: #E4EAE5;
  --scrim: rgba(12, 16, 28, .48); --frame: #0B0F1A;
  --shadow: 0 1px 2px rgba(21, 26, 45, .05), 0 8px 24px rgba(21, 26, 45, .07);
  --shadow-lg: 0 24px 60px rgba(21, 26, 45, .22);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --text: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --read: "Literata", Georgia, "Times New Roman", serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 12px; --r-card: 16px; --r-sheet: 22px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0E1412; --surface: #141C19; --surface-2: #1B2521; --line: #24302B; --line-2: #34423B;
    --fg: #ECF1ED; --fg-2: #A9B5AE; --fg-3: #77847C;
    --ink: #97A6FF; --ink-hover: #B2BDFF; --ink-soft: #1D2440; --on-ink: #0C1130;
    --marge: #FF7684; --marge-soft: #381C21; --on-marge: #24080D;
    --ok: #4FCB9C; --ok-soft: #12302A; --on-ok: #062118;
    --gold: #F0BB3A;
    --rule: rgba(236, 241, 237, .045); --rule-2: rgba(236, 241, 237, .085); --margin-line: rgba(255, 118, 132, .5);
    --scrim: rgba(0, 0, 0, .62); --frame: #000000;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28);
    --shadow-lg: 0 24px 60px rgba(0, 0, 0, .55);
    color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0E1412; --surface: #141C19; --surface-2: #1B2521; --line: #24302B; --line-2: #34423B;
    --fg: #ECF1ED; --fg-2: #A9B5AE; --fg-3: #77847C;
    --ink: #97A6FF; --ink-hover: #B2BDFF; --ink-soft: #1D2440; --on-ink: #0C1130;
    --marge: #FF7684; --marge-soft: #381C21; --on-marge: #24080D;
    --ok: #4FCB9C; --ok-soft: #12302A; --on-ok: #062118;
    --gold: #F0BB3A;
    --rule: rgba(236, 241, 237, .045); --rule-2: rgba(236, 241, 237, .085); --margin-line: rgba(255, 118, 132, .5);
    --scrim: rgba(0, 0, 0, .62); --frame: #000000;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28);
    --shadow-lg: 0 24px 60px rgba(0, 0, 0, .55);
    color-scheme: dark; }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.55 var(--text); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--ink); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; font-family: var(--display); font-weight: 700; letter-spacing: -.02em; line-height: 1.12; text-wrap: balance; }
p { margin: 0; }
ol { margin: 0; padding: 0; list-style: none; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.small { font-size: 14.5px; }
.xs { font-size: 13px; }
.kicker { font: 700 12.5px/1.2 var(--text); letter-spacing: .09em; text-transform: uppercase; color: var(--fg-3); }
.h2 { font-size: 25px; }
.h3 { font: 700 19px/1.2 var(--display); letter-spacing: -.015em; }
.clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.center { text-align: center; justify-items: center; }

/* Shell: the phone column scrolls; on wide screens a beta guide sits beside a framed phone */
.shell { height: 100%; display: flex; justify-content: center; align-items: center; gap: 40px; }
.guide-side { display: none; }
.app { position: relative; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; container-type: inline-size; }
.scroller { position: relative; flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
@media (min-width: 1024px) {
  .shell { padding-block: 24px; }
  .app { width: 420px; height: min(880px, calc(100% - 8px)); border-radius: 36px; border: 8px solid var(--frame); box-shadow: var(--shadow-lg); }
  .guide-side { display: block; width: 330px; max-height: calc(100% - 8px); overflow: auto; }
}
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.scroller.enter > * { animation: enter .32s var(--ease) both; }
@keyframes enter { from { opacity: .35; transform: translateY(6px); } }

svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.xs { width: 13px; height: 13px; } svg.i.sm { width: 16px; height: 16px; } svg.i.lg { width: 24px; height: 24px; } svg.i.xl { width: 30px; height: 30px; }

/* Promo strip and header */
.promo { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 2px 8px; width: 100%; padding: 8px 16px; background: var(--marge-soft); color: var(--marge); font-size: 14px; font-weight: 700; text-align: center; }
.promo .cd { color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.header { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 2px; min-height: 60px; padding: 8px 8px 8px max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(12px); backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.brand { display: inline-flex; align-items: center; gap: 9px; margin-right: auto; }
.logo { width: 30px; height: 30px; flex: none; }
.wordmark { font: 700 19.5px/1 var(--display); letter-spacing: -.035em; white-space: nowrap; }
.wordmark i { font-style: normal; color: var(--ink); }
.hbtn { min-width: 42px; height: 42px; padding: 0 6px; border-radius: 10px; display: grid; place-items: center; position: relative; font: 700 14px/1 var(--text); letter-spacing: .04em; transition: background .15s; }
.hbtn:hover { background: var(--surface-2); }
.hbtn .badge { position: absolute; top: 4px; right: 3px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--marge); color: var(--on-marge); font-size: 11px; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: var(--r); border: 1.5px solid transparent; font: 700 16px/1.2 var(--text); text-align: center; transition: background .18s var(--ease), border-color .18s var(--ease), transform .12s var(--ease); }
.btn:active { transform: scale(.985); }
.btn-primary { background: var(--ink); color: var(--on-ink); }
.btn-primary:hover { background: var(--ink-hover); }
.btn-line { background: var(--surface); border-color: var(--line-2); color: var(--fg); }
.btn-line:hover { border-color: var(--fg-3); }
.btn-quiet { background: var(--surface-2); color: var(--fg); }
.btn-wa { background: var(--wa); color: var(--on-wa); }
.btn-lg { min-height: 56px; font-size: 17px; }
.btn-sm { min-height: 40px; padding: 0 14px; font-size: 14.5px; }
.btn-block { width: 100%; }
.link { color: var(--ink); font-weight: 700; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.icon-btn { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; border: 1.5px solid var(--line-2); background: var(--surface); flex: none; }
.icon-btn.sm { width: 36px; height: 36px; border-radius: 9px; }

/* Hero: the one ruled page */
.hero { position: relative; overflow: hidden; background: var(--surface); border-bottom: 1px solid var(--line); }
.hero::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(var(--rule-2) 1px, transparent 1px), linear-gradient(90deg, var(--rule-2) 1px, transparent 1px), linear-gradient(var(--rule) 1px, transparent 1px); background-size: 100% 32px, 32px 100%, 100% 8px; }
.hero::after { content: ""; position: absolute; top: 0; bottom: 0; left: max(26px, calc(env(safe-area-inset-left, 0px) + 10px)); width: 1.5px; background: var(--margin-line); }
.hero-in { position: relative; z-index: 1; display: grid; gap: 16px; padding-block: 28px 24px; padding-left: max(44px, calc(env(safe-area-inset-left, 0px) + 28px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hero h1 { font-size: clamp(34px, 10.6cqw, 46px); line-height: 1.02; letter-spacing: -.04em; font-weight: 800; }
.hero .lead { font-size: 17.5px; color: var(--fg-2); max-width: 36ch; }
.u { position: relative; white-space: nowrap; color: var(--ink); }
.u svg { position: absolute; left: -2%; width: 104%; bottom: -.17em; height: .34em; overflow: visible; }
.u path { fill: none; stroke: var(--marge); stroke-width: 3.4; stroke-linecap: round; stroke-dasharray: 240; stroke-dashoffset: 240; animation: ink .9s .35s var(--ease) forwards; }
@keyframes ink { to { stroke-dashoffset: 0; } }
.hero-cta { display: grid; gap: 10px; justify-items: start; }
.hero-cta .link { font-size: 15.5px; }
.fan { display: flex; justify-content: center; align-items: flex-end; padding: 14px 0 4px; }
.fan > button { width: 31%; max-width: 150px; flex: none; transition: transform .25s var(--ease); }
.fan > button:nth-child(1) { transform: rotate(-8deg) translate(20%, 7%); }
.fan > button:nth-child(2) { position: relative; z-index: 2; }
.fan > button:nth-child(3) { transform: rotate(8deg) translate(-20%, 7%); }
.trust { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14.5px; font-weight: 700; }
.trust span { display: inline-flex; align-items: center; gap: 6px; }
.trust svg { color: var(--ok); }

/* Sections */
.section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding-top: 36px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-head h2 { font-size: 25px; }
.sec-head .link { font-size: 15px; white-space: nowrap; }
.sec-note { margin-top: -8px; }

/* Covers: a labelled exercise book, one colour per product */
.cover { --c: #2A3CC4; position: relative; display: block; width: 100%; max-width: 100%; aspect-ratio: 5 / 7; border-radius: 3px 8px 8px 3px; overflow: hidden; container-type: inline-size; color: var(--label); text-align: left;
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 80%, #FFFFFF) 0%, var(--c) 40%, color-mix(in srgb, var(--c) 78%, #000000) 100%);
  box-shadow: inset 5cqw 0 0 rgba(0, 0, 0, .16), inset 5.6cqw 0 0 rgba(255, 255, 255, .14), 0 1px 1px rgba(0, 0, 0, .12), 0 12px 22px -10px rgba(0, 0, 0, .45); }
.cover::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, .07) 1px, transparent 1px); background-size: 100% 6cqw; }
.cv-label { position: absolute; left: 15%; right: 9%; top: 21%; background: var(--label); color: var(--cover-ink); border-radius: 2.4cqw; padding: 7cqw 6.5cqw 6cqw; display: grid; gap: 3cqw;
  box-shadow: inset 0 0 0 1.6cqw var(--label), inset 0 0 0 2.1cqw var(--c), 0 1cqw 3cqw rgba(0, 0, 0, .18); }
.cv-brand { font: 800 4.4cqw/1 var(--text); letter-spacing: .16em; color: var(--c); }
.cv-t { font: 800 10.6cqw/1.02 var(--display); letter-spacing: -.035em; text-wrap: balance; }
.cv-a { font: 600 4.6cqw/1.2 var(--text); color: var(--cover-meta); border-top: .5cqw solid var(--cover-rule); padding-top: 3cqw; }
.cv-foot { position: absolute; left: 15%; right: 9%; bottom: 6.5%; display: flex; justify-content: space-between; font: 700 4.4cqw/1 var(--text); letter-spacing: .12em; text-transform: uppercase; opacity: .92; }
.cv-tag { position: absolute; top: 6%; right: 7%; background: var(--label); color: var(--cover-ink); font: 800 4.6cqw/1 var(--text); padding: 2.2cqw 3.2cqw; border-radius: 1.6cqw; letter-spacing: .06em; text-transform: uppercase; }
.thumb { display: block; width: 46px; flex: none; }
.thumb.lg { width: 64px; }

/* Prices */
.pr { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; min-width: 0; }
.price { font: 700 19px/1.1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
.was { color: var(--fg-3); text-decoration: line-through; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.off { background: var(--marge); color: var(--on-marge); font: 700 12.5px/1 var(--text); padding: 4px 6px; border-radius: 6px; white-space: nowrap; align-self: center; }
.pr.big .price { font-size: 30px; letter-spacing: -.03em; }
.pr.big .was { font-size: 16px; }
.deadline { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; color: var(--marge); font-weight: 700; font-size: 14.5px; }
.deadline .num, .deadline b { white-space: nowrap; }
.stars { color: var(--gold); letter-spacing: 1px; white-space: nowrap; }
.stars .dim { color: var(--line-2); }
.st { display: inline-flex; align-items: center; gap: 4px; color: var(--fg); font-weight: 700; }
.st svg { color: var(--gold); fill: currentColor; }

/* Product rows */
.plist { display: grid; gap: 10px; }
.prow { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 14px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.prow > button:first-child { align-self: start; }
.prow-b { display: grid; gap: 5px; align-content: start; min-width: 0; }
.prow-type { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); }
.prow-t { font: 700 17px/1.22 var(--display); letter-spacing: -.015em; text-align: left; }
.prow-meta { font-size: 14px; color: var(--fg-2); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.prow-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: 4px; }
.add { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; border: 1.5px solid var(--line-2); color: var(--fg); flex: none; background: var(--surface); }
.add[aria-pressed="true"] { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.soon { font-size: 14px; color: var(--fg-2); }
.soon b { color: var(--fg); }

/* Featured book */
.feature { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
.feature-top { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 16px; padding: 18px 16px; background: color-mix(in srgb, var(--c) 8%, var(--surface)); }
.feature-top .prow-t { font-size: 20px; }
.feature-bot { padding: 16px; display: grid; gap: 12px; border-top: 1px solid var(--line); }
.duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }

/* How it works: a real three-step sequence */
.steps { display: grid; }
.step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; position: relative; padding-bottom: 22px; }
.step:last-child { padding-bottom: 0; }
.step:not(:last-child)::before { content: ""; position: absolute; left: 16px; top: 40px; bottom: 4px; width: 2px; background: var(--line-2); }
.step .n { width: 34px; height: 34px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); color: var(--ink); display: grid; place-items: center; font: 800 15px/1 var(--display); }
.step > div > b { display: block; font: 700 18px/1.25 var(--display); letter-spacing: -.01em; margin: 5px 0 3px; }
.ussd { margin-top: 12px; max-width: 290px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; box-shadow: var(--shadow); font-size: 15px; }
.ussd .pin { height: 30px; border-bottom: 2px solid var(--ink); font: 700 18px/30px var(--mono); letter-spacing: .4em; color: var(--fg-3); }
.ussd .acts { display: flex; justify-content: flex-end; gap: 22px; font-weight: 800; font-size: 13.5px; letter-spacing: .05em; color: var(--ink); text-transform: uppercase; }

/* Promo code */
.coupon { border: 1.5px dashed color-mix(in srgb, var(--marge) 55%, transparent); background: var(--marge-soft); border-radius: var(--r-card); padding: 20px 18px; display: grid; gap: 10px; }
.coupon h3 { font-size: 26px; letter-spacing: -.03em; }
.code { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 6px 6px 16px; min-width: 0; }
.code > span { font: 700 19px/1 var(--mono); letter-spacing: .14em; min-width: 0; }
.code > span.url { font: 700 15px/1.2 var(--text); letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Lists */
.feats { display: grid; gap: 18px; }
.feat { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: start; }
.feat .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--ink-soft); color: var(--ink); display: grid; place-items: center; }
.feat b { display: block; font: 700 17px/1.25 var(--display); margin-bottom: 2px; }
.checks { display: grid; gap: 10px; }
.checks > div { display: flex; gap: 10px; align-items: flex-start; }
.checks svg { color: var(--ok); margin-top: 3px; }

/* Reviews */
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: 84%; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); scroll-padding-inline: 16px; }
.rail::-webkit-scrollbar { display: none; }
.review { scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px; display: grid; gap: 12px; align-content: start; }
.review .rv-t { font: italic 400 16px/1.6 var(--read); }
.who { display: flex; gap: 10px; align-items: center; }
.ava { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 800 15px/1 var(--display); background: var(--ink-soft); color: var(--ink); flex: none; }
.verified { color: var(--ok); font-weight: 700; }
.reply { border-left: 2px solid var(--ink); padding-left: 12px; font-size: 14.5px; color: var(--fg-2); }
.reply b { display: block; color: var(--fg); font-size: 13px; }
.rating-sum { display: flex; align-items: center; gap: 14px; }
.rating-sum .big { font: 800 44px/1 var(--display); letter-spacing: -.04em; }

/* Author, community, FAQ, support */
.author, .wa-block, .panel, .receipt { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.author-id { display: flex; gap: 14px; align-items: center; }
.author .ava { width: 60px; height: 60px; font-size: 20px; background: var(--ink); color: var(--on-ink); }
.wa-chip { width: 46px; height: 46px; border-radius: 13px; background: var(--wa); color: var(--on-wa); display: grid; place-items: center; flex: none; }
.wa-chip.sm { width: 38px; height: 38px; border-radius: 11px; }
.faq { border-top: 1px solid var(--line); }
.faq-item { border-bottom: 1px solid var(--line); }
