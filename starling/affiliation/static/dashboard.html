<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord affilié</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2230; --muted:#5b6475; --accent:#2f6fde; --border:#dde1e8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151b; --card:#1b2029; --text:#e6e9ef; --muted:#9aa3b2; --accent:#6c9cf0; --border:#2c3340; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:960px; margin:0 auto; padding:32px 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:16px; overflow-x:auto; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:16px; }
  .tile { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; }
  .tile b { display:block; font-size:24px; font-variant-numeric:tabular-nums; }
  .tile span { color:var(--muted); font-size:14px; }
  input { padding:10px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; width:min(420px, 100%); }
  button { padding:10px 18px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--border); white-space:nowrap; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  code { word-break:break-all; } .error { color:#d64545; } .muted { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Mon tableau de bord</h1>
  <form class="card" id="login">
    <input id="key" type="password" placeholder="Votre clé API" required> <button>Afficher</button>
    <p class="error" id="err"></p>
  </form>

  <div id="dash" hidden>
    <p class="muted">Affilié : <strong id="who"></strong> — code <code id="code"></code></p>
    <div class="tiles" id="tiles"></div>
    <div class="card"><h2>Mes liens</h2>
      <p>Parrainage : <code id="ref"></code></p>
      <table><thead><tr><th>Produit</th><th>Lien</th></tr></thead><tbody id="links"></tbody></table>
    </div>
    <div class="card"><h2>Commissions</h2>
      <table><thead><tr><th>Date</th><th>Commande</th><th>Produit</th><th>Niveau</th>
        <th class="num">Vente</th><th class="num">Commission</th><th>Statut</th></tr></thead>
        <tbody id="comms"></tbody></table>
    </div>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const eur = (n) => n.toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
  const STATUS = { pending: "En attente", approved: "Approuvée", rejected: "Refusée", paid: "Payée" };
  function row(cells, nums = []) {
    const tr = document.createElement("tr");
    cells.forEach((c, i) => { const td = document.createElement("td"); td.textContent = c;
      if (nums.includes(i)) td.className = "num"; tr.append(td); });
    return tr;
  }
  async function load(key) {
    const res = await fetch("/api/me", { headers: { "X-Api-Key": key } });
    const data = await res.json();
    if (!res.ok) { $("err").textContent = data.error; return; }
    try { localStorage.setItem("aff_api_key", key); } catch {}
    $("err").textContent = ""; $("dash").hidden = false;
    $("who").textContent = data.affiliate.name; $("code").textContent = data.affiliate.code;
    $("ref").textContent = data.referral_link;
    const s = data.stats;
    $("tiles").replaceChildren(...[
      ["Clics", s.clicks], ["Ventes", s.conversions], ["Taux de conversion", s.conversion_rate + " %"],
      ["Chiffre d'affaires généré", eur(s.revenue)], ["Solde à percevoir", eur(s.balance_due)],
      ["En attente", eur(s.commissions.pending)], ["Déjà payé", eur(s.commissions.paid)], ["Filleuls", s.referrals],
    ].map(([label, value]) => { const d = document.createElement("div"); d.className = "tile";
      const b = document.createElement("b"); b.textContent = value;
      const sp = document.createElement("span"); sp.textContent = label; d.append(b, sp); return d; }));
    $("links").replaceChildren(...data.links.map((l) => row([l.product, l.url])));
    $("comms").replaceChildren(...data.commissions.map((c) => row([
      new Date(c.created_at * 1000).toLocaleDateString("fr-FR"), c.order_id, c.product_name,
      c.level === 1 ? "Direct" : "Parrainage", eur(c.sale_amount), eur(c.amount), STATUS[c.status],
    ], [4, 5])));
  }
  $("login").addEventListener("submit", (e) => { e.preventDefault(); load($("key").value.trim()); });
  try { const k = localStorage.getItem("aff_api_key"); if (k) { $("key").value = k; load(k); } } catch {}
</script>
</body>
</html>
