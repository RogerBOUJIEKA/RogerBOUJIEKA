<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Figtree:wght@400;500;600&display=swap">
<style id="app-style">
/* Layout: a sticky toolbar over A4-landscape sheets, each folded into two A5 pages; testimonies flow page to page as cards.
   The paper follows the faire-part's branding (royal blue, navy, gold, Archivo) and stays white in both themes. */
:root {
  --bg: #e9ebef; --fg: #1d2230; --muted: #5d6475; --line: #cfd3db;
  --bar: #ffffffee; --btn: #ffffff; --btn-fg: #1d2230;
  --accent: #33456b; --accent-fg: #ffffff; --warn: #a3401f;
  --paper: #ffffff; --ink: #1b2533; --blue: #004b9c; --navy: #003b6d; --gold: #d0a932; --tint: #eaf1f9;
  --display: "Archivo", "Arial", sans-serif;
  --body: "Archivo", "Arial", sans-serif;
  --ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171a21; --fg: #e6e8ee; --muted: #9aa1b2; --line: #343947;
  --bar: #1f232ced; --btn: #262b36; --btn-fg: #e6e8ee;
  --accent: #8ea4d6; --accent-fg: #121520; --warn: #f08a68; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #171a21; --fg: #e6e8ee; --muted: #9aa1b2; --line: #343947;
  --bar: #1f232ced; --btn: #262b36; --btn-fg: #e6e8ee;
  --accent: #8ea4d6; --accent-fg: #121520; --warn: #f08a68; color-scheme: dark }

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.bar h1 { font-family: var(--display); font-weight: 700; font-size: 22px; margin: 0 8px 0 0; }
.field { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; }
.field input, .field select { font: inherit; color: var(--fg); background: var(--btn); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
.field input { width: 220px; max-width: 52vw; }
.btn { font: 500 13px var(--ui); color: var(--btn-fg); background: var(--btn); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, .field input:focus-visible, .field select:focus-visible, [contenteditable]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
.spacer { flex: 1; }
.status { font-size: 12px; color: var(--muted); min-height: 1em; }
.status.dirty { color: var(--warn); }

.help { max-width: 1180px; margin: 14px auto 0; font-size: 13px; color: var(--muted); line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.help b { color: var(--fg); font-weight: 600; }
.count { font-variant-numeric: tabular-nums; }
.count.over { color: var(--warn); font-weight: 600; }

.sheets { display: flex; flex-direction: column; align-items: center; gap: 26px;
  padding-block: 18px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet-label { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: -18px; }
.sheet-wrap { position: relative; max-width: 100%; }
.sheet-wrap > .sheet { transform-origin: top left; position: absolute; top: 0; left: 0; box-shadow: 0 2px 14px rgba(15,20,35,.18); }

/* ---- Paper (fixed print colors, from the faire-part) ---- */
.sheet { width: 297mm; height: 210mm; background: var(--paper); color: var(--ink); display: flex; position: relative; }
.narrow .sheet { width: 148.5mm; height: 420mm; flex-direction: column; }
.sheet.fold::after { content: ""; position: absolute; left: 50%; top: 9mm; bottom: 9mm; border-left: .3mm solid #c5cfdc; }
.narrow .sheet.fold::after { left: 9mm; right: 9mm; top: 50%; bottom: auto; border-left: 0; border-top: .3mm dashed #c5cfdc; }
.page { flex: none; width: 148.5mm; height: 210mm; padding: 8mm 9mm 9mm; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.page::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3.2mm; background: var(--blue); }
.page::before { content: ""; position: absolute; left: 9mm; right: 9mm; bottom: 5mm; border-top: .35mm solid var(--gold); }
.flow { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2.6mm; }
.pno { display: none; }
.head { display: flex; flex-direction: column; align-items: center; gap: 1.6mm; padding-bottom: 1.2mm; }
.banner { background: var(--blue); color: #fff; border-radius: 2.6mm; padding: 2.2mm 9mm; font: 700 17pt/1 var(--display); letter-spacing: .04em; }
.mem { margin: 0; text-align: center; line-height: 1.05; }
.mem span { display: block; font: 400 9pt var(--display); letter-spacing: .22em; color: var(--ink); }
.mem b { display: block; font: 900 15pt var(--display); color: var(--blue); text-transform: uppercase; letter-spacing: .01em; }
.dates { font: 700 7.5pt var(--display); color: #fff; background: var(--navy); border-radius: 9mm; padding: .9mm 3.2mm; letter-spacing: .06em; }

.box { position: relative; padding: 2.6mm 3.2mm; font-size: var(--fs, 10pt); border-radius: 2.4mm; }
.box .titre { font: 700 1.05em/1.25 var(--display); color: var(--blue); margin-bottom: .9mm; }
.box .text { font: 400 1em/1.36 var(--body); color: var(--ink); white-space: pre-wrap; text-align: justify; hyphens: auto; }
.box .sig { display: table; margin: 1.6mm 0 0 auto; max-width: 100%; text-align: right; font: 700 .86em/1.3 var(--display); color: #fff; background: var(--navy); border-radius: 1.6mm; padding: .7mm 2.4mm; }
.box.cont .text::after { content: " …"; }
.box.contd .text::before { content: "… "; }
/* Four frames in the faire-part's style, used in turn. */
.box.s0 { border: .35mm solid var(--blue); }
.box.s1 { background: var(--tint); }
.box.s2 { background: var(--blue); }
.box.s2 .titre, .box.s2 .text { color: #fff; }
.box.s2 .sig { background: #fff; color: var(--blue); }
.box.s3 { border: .35mm solid var(--gold); }

[contenteditable] { border-radius: 2px; }
[contenteditable]:hover { background: rgba(51,69,107,.06); }
[contenteditable]:empty::before { content: attr(data-ph); color: #a0a6b3; font-style: italic; }
.box.s2 [contenteditable]:hover { background: rgba(255,255,255,.12); }
/* Print: one A5 page per printed page, used to build the faire-part PDF. */
@page { size: 148.5mm 210mm; margin: 0; }
@media print {
  .bar, .help, .sheet-label, .ctl, .warn, .empty-note { display: none !important; }
  body { background: #fff; }
  .sheets { display: block; padding: 0; }
  .sheet-wrap { width: auto !important; height: auto !important; }
  .sheet-wrap > .sheet, .sheet { position: static; transform: none !important; display: block; width: auto; height: auto; box-shadow: none; }
  .sheet.fold::after { display: none; }
  .page { break-after: page; }
  [contenteditable]:empty::before { content: none; }
}
.ctl { position: absolute; top: -2.6mm; right: 2mm; display: flex; gap: 1mm; opacity: 0; transition: opacity .15s; }
.box:hover .ctl, .box:focus-within .ctl { opacity: 1; }
.ctl button { font: 500 10px var(--ui); background: #fff; color: #1d2230; border: 1px solid #c9cdd6; border-radius: 4px; padding: 2px 6px; cursor: pointer; }
.ctl button:hover { border-color: #33456b; }
.ctl button.danger { color: #a3401f; }
.warn { font: 600 10px var(--ui); color: #fff; background: #a3401f; border-radius: 3px; padding: 3px 6px; text-align: center; }
.empty-note { margin: auto; color: #9aa0ad; font: 500 11px var(--ui); text-align: center; }
.exporting .ctl, .exporting .warn, .exporting .empty-note { display: none !important; }
#export-host { position: fixed; left: -100000px; top: 0; }
@media (hover: none) { .ctl { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .ctl { transition: none; } }
@media (max-width: 640px) { .bar h1 { width: 100%; } .spacer { display: none; } }
</style>

<div id="app">
  <header class="bar"><div class="bar-in">
    <h1>Témoignages</h1>
    <label class="field" for="defunt">En mémoire de <input id="defunt" type="text" placeholder="Nom de la personne décédée"></label>
    <label class="field" for="size">Texte
      <select id="size">
        <option value="8">Très petit</option>
        <option value="8.5">Petit</option>
        <option value="9">Moyen</option>
        <option value="10">Grand</option>
      </select>
    </label>
    <label class="check" for="fold"><input id="fold" type="checkbox"> Barre au milieu</label>
    <span class="spacer"></span>
    <button class="btn" id="add" type="button">+ Ajouter un témoignage</button>
    <button class="btn" id="save" type="button">Enregistrer</button>
    <button class="btn primary" id="pdf" type="button">Télécharger le PDF</button>
    <span class="status" id="status" role="status"></span>
  </div></header>
  <p class="help">Format <b>A4 paysage plié en deux</b> : chaque feuille donne deux pages A5. Chaque témoignage est dans un rectangle, et les rectangles passent d'eux-mêmes à la page suivante. Cliquez sur un texte ou une signature pour le modifier ; « + Titre » ajoute une ligne de titre en haut d'un rectangle. <span class="count" id="count"></span></p>
  <main class="sheets" id="sheets"></main>
  <div id="export-host" aria-hidden="true"></div>
</div>

<script type="application/json" id="state">{"defunt": "Maman Monique", "fold": false, "size": 8, "items": [{"titre": "Maman…", "auteur": "Tene Talla Jean", "texte": "Tous les mots du monde ne seront jamais assez pour décrire la personne exceptionnelle que tu as été, et l'impact que tu as eu à la fois dans ma vie et dans la vie de plusieurs. Merci à Dieu pour le modèle que tu as été pour moi et le privilège qu'il m'a fait de te connaître, car tu es pour moi une source intarissable de motivation. Merci pour l'héritage le plus précieux que tu me laisses : la foi en Dieu, et un amour inconditionnel les uns pour les autres. Tu as combattu le bon combat, tu as achevé la course, et jusqu'à la fin tu as gardé la foi.\nMerci pour tout.\nI miss you mom, rest in peace.", "id": "t1"}, {"titre": "", "auteur": "Théophile Fotsing", "texte": "Merci maman pour le don de la vie. Merci pour la formidable maman que tu as été pour nous et pour tes petits-enfants.\nMerci pour l'amour que papa et toi avez su inculquer au sein de notre famille.\nTu nous as inculqué des valeurs qui ont fait de moi ce que je suis aujourd'hui.\nJe rends grâce à Dieu de t'avoir eue comme maman, comme modèle et comme conseillère dans ma vie.\nMerci maman. Repose en paix.", "id": "t2"}, {"titre": "Maman, Mater, Grand-mère…", "auteur": "Ta belle-mère, Espérance", "texte": "Comme il m'est difficile de faire cet exercice, celui d'écrire un hommage à la belle âme que tu as été. Mon cœur est meurtri. Aujourd'hui, je me rends compte à quel point tout semble dépeuplé autour de moi.\nLorsque je suis passée dire au revoir à Maman le 7 septembre, elle a prié pour moi. Nous avons parlé, elle m'a donné des conseils. Je ne savais pas que ce serait la dernière fois que je la verrais.\nAprès le départ de papa, mes frères et moi avions décidé de faire de chaque jour de sa vie un moment de qualité, de profiter pleinement de sa présence et de lui donner tout l'amour qu'elle méritait. Voilà qu'elle nous quitte alors que nous avions encore tant de choses à partager avec elle.\nLa douleur de l'avoir perdue ne nous empêchera jamais de nous remémorer tous ces merveilleux moments passés ensemble.\nMaman était une femme vertueuse, douce, discrète et généreuse, avec un cœur immense. Sa maison était toujours ouverte à tous, un véritable centre d'accueil. Chez elle, il n'existait pas de distinction entre les beaux-fils, les belles-filles et les amis de ses enfants. Tous ceux qui franchissaient sa porte devenaient ses enfants. C'était toujours « mon fils », « ma fille ». Elle savait accueillir, aimer et donner sans compter.\nElle a servi le Seigneur de tout son cœur jusqu'à la dernière minute. Elle a été un modèle de foi et de résilience.\nPendant douze longues années de mariage sans enfant, elle a connu la persécution, les moqueries et les paroles blessantes. On l'a traitée de stérile. Pourtant, jamais elle n'a baissé les bras. Elle a continué à espérer et à croire en Celui en qui elle avait placé sa confiance.\nEt le Seigneur les a exaucés.\nElle a vu ! Ses yeux ont vu !\nQuel témoignage de foi et de persévérance ! Son histoire nous rappelle que, malgré les épreuves, Dieu demeure fidèle.\nAujourd'hui, la douleur de son absence est immense, mais elle ne saurait effacer la richesse de l'héritage qu'elle nous laisse. Nous garderons jalousement tout ce qu'elle nous a inculqué, cet amour inconditionnel, cette générosité, cette douceur et cette foi qui ont marqué sa vie.\nNous continuerons de faire vivre ses valeurs, de transmettre ses enseignements et de raconter son histoire. Car une femme comme elle ne disparaît jamais vraiment. Elle continue de vivre à travers les vies qu'elle a touchées, les cœurs qu'elle a aimés et les graines qu'elle a semées.\nElle vivra à jamais dans nos cœurs et dans nos souvenirs.\nRepose en paix, Maman chérie. ❤️", "id": "t3"}, {"titre": "", "auteur": "Ta mère, comme tu m'appelais affectueusement, Ruth Njong", "texte": "Aujourd'hui, nous ne pleurons pas comme ceux qui n'ont pas d'espérance. Nous célébrons la vie de ma maman, une véritable femme de foi. Maman n'était pas une chrétienne du dimanche. Sa foi était vivante. C'était une femme de prière, une femme de la Parole, une femme qui a servi Dieu dans le secret et dans la fidélité. Elle nous a enseigné à prier avant de nous plaindre, à pardonner et refuser de garder rancune, et à toujours mettre Dieu en premier.\nElle priait pour tout. Elle m'appelait au téléphone et me disait : « Prions avant que tu ne prennes tes médicaments. » Je l'ai vue jeûner en silence quand nous traversions des épreuves, je l'ai vue ouvrir sa Bible usée tous les jours comme si c'était son pain. Elle ne nous a pas laissé d'or ni d'argent, elle nous a laissé quelque chose de plus précieux : Jésus-Christ.\nElle a combattu le bon combat, elle a achevé la course, elle a gardé la foi (2 Timothée 4:7). Son corps nous quitte, mais son héritage demeure en nous. Son plus grand désir était de voir ses enfants marcher avec le Seigneur. Et c'est ce que nous ferons.\nMerci Maman. Repose en paix auprès de ton Seigneur et Sauveur.", "id": "t4"}, {"titre": "Ma petite sœur, ma mère, ma fille,", "auteur": "Ta grande sœur, Mme TALLA Pauline", "texte": "Nous étions 7 chez nos parents, nous ne sommes restées que 2 depuis 2 ans.\nNotre cadet nous a quittés en octobre 2024.\nNous étions comme des jumelles. Toi, Mme TALLA. Moi, Mme TALLA.\nAujourd'hui, tu pars sans me dire au revoir… sur la pointe des pieds.\nJe suis désormais seule… Quelle tristesse ! Quelle douleur !\nNéanmoins, je rends grâce à Dieu pour les moments que nous avons passés ensemble.\nPuisse le Très-Haut t'accorder une place de choix dans son royaume.\nRepose en paix.", "id": "t5"}, {"titre": "", "auteur": "Flaubert FEZEU", "texte": "À peine avions-nous pris conscience de ta maladie que la mort s'en est mêlée. Tu es partie, laissant dans la tristesse tous ceux qui, disséminés à travers le monde, aimaient tes intrigues et ton attentionnisme de « mère poule ». Peut-être faut-il seulement comprendre que tu as voulu, dans ton amour, épargner aux uns et aux autres la souffrance de te voir rongée par la maladie. Nous aurions voulu être un tout petit peu préparés à un tel choc, mais qui sommes-nous ? Merci pour la maman que tu as été.", "id": "t6"}, {"titre": "", "auteur": "Ton Benjamin, Patrick Njong", "texte": "J'écris ces mots non pas comme un gendre, mais comme un fils. Car Maman Monique n'a jamais été une belle-mère pour moi, elle a été une maman. Dès le premier jour, elle m'a accueilli avec une générosité que je n'oublierai jamais. Et très vite, entre nous, s'est installée une belle complicité. On se taquinait beaucoup. Elle m'appelait son benjamin, je la taquinais… On riait, on se lançait des petites piques, et dans chaque taquinerie, il y avait de l'amour. C'était notre langage à nous. Derrière les rires, il y avait un profond respect.\nJe la voyais se lever tôt pour prier, je la voyais jeûner pour nous, pour ses enfants, pour notre couple, pour notre foyer. Maman Monique priait pour moi comme une mère prie pour son propre fils. Et je sais aujourd'hui que beaucoup de mes batailles ont été gagnées grâce à ses prières secrètes. Elle était généreuse, d'une générosité rare. Elle donnait sans jamais compter. Perdre Maman Monique, c'est perdre une mère, une conseillère, une intercesseuse.\nMaman, merci. Merci de m'avoir aimé comme ton fils. Merci pour tes prières, pour tes jeûnes, pour tes rires, pour nos taquineries qui vont tellement me manquer. Je promets de prendre soin de ta fille, comme tu me l'as toujours demandé dans la prière.\nVa en paix, Maman Monique. Ta couronne t'attend. Nous t'aimons.", "id": "t7"}, {"titre": "Maman Monique,", "auteur": "Nadège Tene", "texte": "Tu as été une maman douce, calme, hyper gentille, pleine de sagesse. À une époque où les relations entre belle-fille et belle-mère sont réputées pour leurs tensions, avec toi la vie était facile. Je ne peux pas oublier ces fois où tu faisais à manger et m'en expédiais. Ton départ laisse un grand vide, mais ton amour reste. J'aurais aimé profiter de ta sagesse plus longtemps.\nRepose en paix, Mater, et merci pour tout.", "id": "t8"}, {"titre": "", "auteur": "Sarah Emmanuelle, ta petite-fille, « ta grand-mère » comme tu m'appelais tendrement", "texte": "Au-delà d'être une grand-mère, tu as été ma mère, ma copine, ma conseillère, mon soutien.\nLa femme que je deviens aujourd'hui, c'est grâce à toi. Grâce à toi, je sais ce que c'est que de se sentir aimée et protégée. Tu as été là pour moi dans mes moments de peur, d'anxiété et de pleurs. Tu m'as boostée durant mes examens. Tu as été mon grand pilier. À tes côtés, je me sentais en paix.\nTu restes mon modèle. Je t'aime.", "id": "t9"}, {"titre": "Chère grand-mère,", "auteur": "Ton petit-fils, Marc Emmanuel", "texte": "Me voici en train d'écrire un mot après ta mort.\nMa grand-mère, tu étais la personne la plus forte et la plus brillante du monde. Et je voulais aussi te dire merci. Merci parce que tu m'as appris à préparer de bons plats, et merci parce que quand tu étais avec moi et mes sœurs, tout changeait. Je t'ai toujours soutenue, et quand tu avais besoin d'aide, j'étais là. Tu sais, grand-mère, toi et grand-père, vous êtes les meilleurs grands-parents qui soient, parce que même dans les difficultés, tu étais là. Ta mort me fait pleurer chaque jour et tu me manques trop. Je t'aime, grand-mère.", "id": "t10"}, {"titre": "", "auteur": "Eunice Léa FEZEU épse NGALLE, ta belle-sœur", "texte": "Grand-mère, ton départ reste jusqu'aujourd'hui comme un rêve. Je n'arrive toujours pas à réaliser que ton parcours sur cette terre est ainsi terminé. Mais au-delà de toutes choses, je bénis le Seigneur qui m'a permis de vivre et de grandir à tes côtés. Tu as été une femme extraordinaire, une femme forte, toujours là à m'encourager et à me booster. Je peux dire avec fierté que la personne que je suis aujourd'hui, c'est en partie grâce à l'éducation que nous avons reçue de vous. C'est tellement difficile d'imaginer la vie sans toi, mais je suis consolée par le fait que tu as servi le Seigneur jusqu'à la fin et qu'actuellement tu es dans un bien meilleur monde que le nôtre. Je me souviens lorsque nous nous retrouvions toutes les deux à la cuisine pour faire des repas… Je ne garde que de beaux souvenirs de nos moments passés ensemble. Je prie que le Seigneur m'accorde de continuer à vivre en accord avec la Parole de Dieu, telle que vous nous l'avez apprise, et d'avoir cette force et ce courage dont tu as fait preuve durant toute ta vie. Je veux te dire au revoir, parce que j'ai l'espérance que nous nous reverrons.", "id": "t11"}, {"titre": "", "auteur": "Archange Talla", "texte": "I never thought I would have to write about our memories. I always thought you would always be there for me. We were supposed to travel together again.\nYou were my lawyer and my judge at the same time, the woman who always wanted the best for me. You never stopped advising me and taking care of me. Even when we were apart, you always found a way to look after me.\nI will carry all your advice in my heart. I miss you more than words can express, and I'm going to miss our arguments so much.\nI love you, Grandma. ❤️", "id": "t12"}, {"titre": "Grand-mère chérie,", "auteur": "Tes petites-filles, Anne-Eliyah, Johanne-Clara, Urielle-Bénédiction et Maella-Rivka", "texte": "À peine avions-nous pris conscience de la place que tu occupais désormais pour nous que tu t'en es allée.\nNous sommes si tristes de savoir que nous n'aurons plus les vacances ensemble au village et à Socada.\nTes bons plats, ton amour, tes conseils et tout ce que tu nous as inculqué comme valeurs resteront dans nos cœurs.\nNous disons merci à Dieu pour la merveilleuse grand-mère que tu as été.\nTu nous manqueras ! Repose en paix, Mamyy !", "id": "t13"}, {"titre": "", "auteur": "Ton fils, MBA Siméon", "texte": "Maman Monique, tu m'as accueilli à Kékem à l'âge de 14 ans. J'ai rejoint les autres enfants de mes tantes maternelles.\nÀ l'époque, en 1974-1975, nous étions 5 enfants sous votre toit, 4 du côté de ton mari et 1 de ton côté. Vous n'aviez pas encore d'enfants et vous aviez choisi de nous adopter.\nTu nous as encadrés avec amour et sans aucune discrimination. Grâce à tes conseils, je suis devenu un homme. Après 14 ans de mariage sans enfant, le Seigneur vous a bénis avec Espérance, Emmanuel, Ruth, Théophile et Jean.\nTu étais une chrétienne protestante engagée, convaincue et convaincante, une rassembleuse, une femme au grand cœur qui ne s'accrochait pas aux biens terrestres.\nCe n'est qu'en devenant moi-même mari, père et grand-père que j'ai compris que toi et ton mari, de regrettée mémoire, étiez des êtres d'exception.\nTu es partie alors que nous préparions les obsèques de ma mère génitrice, après une opération de la tête réussie.\nVa et repose en paix, Maman Monique, que la terre de nos ancêtres te soit légère.", "id": "t14"}, {"titre": "Maman Monique ! Femme exceptionnelle !", "auteur": "Ton fils, Stéphane NGUETA", "texte": "Oui, Maman Monique était une femme pleine de foi, pleine de joie, qu'elle partageait sans retenue à travers son sourire avec tous ceux qui la côtoyaient. Ce sourire ne la quittait jamais et transmettait autour d'elle le bonheur là où il y en avait moins, l'espoir là où tout semblait ne montrer que découragement. Elle avait toujours le bon conseil au moment opportun. Je n'oublierai jamais la source d'encouragement qu'elle a été pour moi lorsque je devais quitter Bafoussam pour rejoindre l'université à Yaoundé, et le gros paquet de petites arachides qu'elle avait pris soin de ramener de Bameka pour moi. Plus récemment, notamment à l'été 2025 lors de son passage chez moi à Bruxelles, j'ai eu l'honneur de bénéficier de ses paroles remplies de sagesse. Elle avait promis qu'elle reviendrait nous confectionner de beaux rideaux pour la maison.\nLa peine est indescriptible de savoir que tu ne seras plus à nos côtés pour être la maman rassurante que tu as été tout au long de ta vie. Tu as fait ton chemin, femme humble mais ferme dans ses convictions, effacée mais efficace, pleine de compassion et toujours prête à se sacrifier pour rendre autrui heureux. Ton exemple nous challenge et nous bousculera toujours. Que Dieu nous donne la force et la sagesse de transmettre les valeurs que tu as laissées dans nos vies.\nQue Dieu t'accueille dans sa félicité céleste et te fasse bénéficier des fruits des œuvres de la servante fidèle et dévouée que tu as été tout au long de ta vie.", "id": "t15"}, {"titre": "Hommage à ma maman, Monique", "auteur": "Ta fille, Florence", "texte": "Maman, depuis l'annonce de ton départ éternel, imaginer ma vie sans toi est une épreuve très difficile à affronter.\nTout au long de ta vie sur terre, tu as incarné l'amour, la tendresse, la générosité, la douceur, la patience, le dévouement, le sacrifice et l'humilité… Toutes ces belles valeurs, tu nous les as transmises avec beaucoup de finesse.\nSeigneur Jésus-Christ, je Te suis infiniment reconnaissante pour la maman exceptionnelle que Tu m'as offerte à un moment de ma vie où je n'avais plus aucun repère.\nAvec un amour inconditionnel, tu m'as accueillie, tu m'as adoptée, tu m'as bien formée, voire transformée. Aujourd'hui, je me retrouve en toi. Quel privilège !\nEn résumé, Maman Monique était celle qui donnait sans compter, consolait sans juger et aimait sans condition ni calcul.\nCertes, ton départ si brusque laisse un vide immense dans nos cœurs, mais les souvenirs que tu nous as laissés resteront un héritage et une richesse inestimables.", "id": "t16"}, {"titre": "Grand-mère Monique,", "auteur": "La famille Ndeffeu Takogne", "texte": "C'est le cœur lourd et les yeux remplis de larmes que nous avons appris que le Seigneur t'a rappelée auprès de Lui. Ton départ nous plonge dans une profonde tristesse et laisse dans nos vies un vide immense, que nul ne saurait combler.\nTu as été un repère, une source de sagesse, une présence rassurante et un précieux trésor pour nous. Nous garderons à jamais dans nos cœurs tes conseils empreints de sagesse, ton amour inconditionnel, ta bienveillance et le souvenir de la maman dynamique et généreuse que tu as été.\nLes moments passés avec toi auront été une véritable bénédiction. À travers tes paroles, tes gestes et l'amour que tu nous as donné, tu as semé en chacun de nous des valeurs et des souvenirs qui ne s'effaceront jamais. Si ton absence nous fait aujourd'hui souffrir, tout ce que tu nous as transmis continuera de vivre à travers nous et les générations à venir.\nTu nous quittes, mais tu ne nous abandonnes pas : ton amour restera notre héritage le plus précieux, et ton souvenir, une lumière qui continuera de nous guider.\nÀ jamais dans nos cœurs. Repose en paix, maman.", "id": "t17"}, {"titre": "", "auteur": "Ta fille, Lydia", "texte": "Maman, tu n'étais pas ma mère biologique, mais tu m'as aimée comme ta propre fille. Tu m'as ouvert ton cœur et tu es devenue cette maman dont mon cœur avait besoin.\nFemme vertueuse et craignant Dieu, tu étais ma confidente, mon refuge. Tu as accompagné mes trois maternités, tu as été ma marraine, mon témoin de mariage, cette voix rassurante qui savait me guider.\nMa première fille porte ton nom. Je garde précieusement le souvenir de la joie que cela t'avait procurée. Aujourd'hui, ce nom est un lien précieux qui nous unit à jamais. À travers elle, un peu de toi continue de vivre auprès de moi.\nTon absence me déchire. Je ne pourrai plus décrocher mon téléphone pour entendre ta voix, ni me dire que même si le monde me tourne le dos, toi tu seras là. Cette place que tu occupais, personne ne pourra la remplacer.\nTu ne m'as pas donné la vie, mais tu as marqué mon existence. Merci pour tes conseils précieux qui m'ont aidée à construire ma vie et mon foyer.\nRepose en paix, ma maman de cœur. La mort t'éloigne de mes yeux, mais jamais de mon cœur.\nJe t'aime, Maman.", "id": "t18"}, {"titre": "", "auteur": "Ton petit-fils, Charlie Nayang", "texte": "Grand-mère, je retiens de toi une femme très forte et travailleuse. Je me souviens de ce soir où nous quittions le village, ta voiture chargée, après une intense récolte des arachides, tous épuisés. Arrivés en ville, je pensais que tu allais te reposer avec grand-père. Mais non, tu t'es d'abord occupée de ranger nos récoltes. Ensuite, tu t'es assurée que nous avions de quoi manger avant de dormir. Ce n'est que tard dans la nuit, quand tout le monde était servi, que tu es allée te laver et manger.\nCe jour-là, j'ai compris le vrai sens du sacrifice. Ton courage et ton amour resteront à jamais mon exemple.", "id": "t19"}, {"titre": "Grand-mère,", "auteur": "Ta petite-fille, Tatiana Evy", "texte": "Je ne sais pas comment accepter ton départ. Tu vas terriblement nous manquer. Ton amour, ta douceur et tes chants fredonnés en faisant la cuisine resteront à jamais gravés dans mon cœur.\nC'est en te regardant aimer, pardonner et prier que j'ai compris ce que signifie être chrétienne. Tu avais une foi simple et inébranlable, et aujourd'hui, tu contemples enfin Celui en qui tu as tant cru.\nTu es partie, mais tu as accompli ta mission. Tu nous laisses un héritage de foi et d'amour.\nRepose auprès de ton Sauveur bien-aimé. Jusqu'à nos retrouvailles, non plus autour de la table de la cuisine, mais autour du banquet de l'Agneau. 🕊️", "id": "t20"}, {"titre": "Grand-mère, comment accepter que nous ne te reverrons plus jamais ?", "auteur": "Tes petites-filles, Ndolo et Hopy, qui t'aiment infiniment, et tout particulièrement ta Bombo", "texte": "Nous n'oublierons jamais ces week-ends passés avec toi, dans la cuisine, à manger des arachides pendant que tu nous racontais tes histoires et nous donnais tes précieux conseils. Ces moments si ordinaires sont devenus aujourd'hui des souvenirs inestimables.\nTu nous as aimées d'un amour si naturel que nous ne nous sommes jamais senties étrangères chez toi. Chez toi, nous étions chez nous. Tu étais notre refuge, notre repère.\nEt moi, ta petite-fille qui porte ton nom, celle que tu appelais tendrement « Bombo », porter ton nom était un cadeau. Aujourd'hui, c'est un héritage encore plus précieux. Chaque fois que je l'entendrai, je penserai à toi.\nNous aurions voulu encore un week-end, encore une histoire, encore un conseil. Tu nous laisses un immense vide, mais aussi un trésor que personne ne pourra nous enlever : ton amour et tes enseignements.\nRepose en paix, notre chère grand-mère. Ton nom vivra en moi, ton amour vivra en nous.", "id": "t21"}, {"titre": "Ma copine, comme je l'appelais affectueusement…", "auteur": "Danielle Fezeu", "texte": "Je dois avouer que j'ai encore du mal à trouver les mots et à écrire ces quelques lignes in loving memory of Grandma…\nLes nombreux témoignages partagés ici racontent déjà si bien le parcours d'une femme dont la vie a été une véritable lumière pour le Seigneur. Alors, à mon tour, j'aimerais simplement parler de celle que tu as été pour moi, de ce que j'ai appris à tes côtés et de cette femme que j'aspire, moi aussi, à devenir.\nJ'aimerais être une grand-mère à la hauteur des standards divins, comme ma copine… ❤️🥹\nJ'aimerais louer comme elle, malgré les vents et les tempêtes.\nJ'aimerais prier et être une prophétesse pour ma descendance, comme ma copine.\nJ'aimerais être tempérée et aimante comme ma copine, aussi constante et ancrée en Christ qu'elle l'était.\nJ'aimerais transmettre à ma progéniture cette même conviction qui l'animait et qu'elle aimait tant me rappeler dans les moments de crise : « J'estime que les souffrances du temps présent ne sauraient être comparées à la gloire à venir qui sera révélée pour nous » (Romains 8:18).\nJ'aimerais, moi aussi, être une grand-mère à l'image de Mama Mo… ❤️🥹\nRepose-toi bien, ma copine. ❤️\nJ'espère qu'à mon tour, je pourrai laisser derrière moi un héritage aussi beau et un parcours aussi riche de sens que le tien. Et qu'un jour, par la grâce de Dieu, nous nous retrouverons…", "id": "t22"}]}</script>
<script id="app-script">
(() => {
  // Pieces of this page's own source, captured before rendering, so "Enregistrer" can republish the page with new data.
  const SRC = {
    head: [...document.querySelectorAll('title, meta[name="claude:viewport-fit-sides"], link[href*="fonts.googleapis"], #app-style')].map(n => n.outerHTML).join("\n"),
    app: document.getElementById("app").outerHTML,
    libs: [...document.querySelectorAll('script[src*="cdnjs"]')].map(n => n.outerHTML).join("\n"),
    script: document.getElementById("app-script").outerHTML,
    reset: (document.head.querySelector("style") || {}).textContent || "",
  };

  let state;
  try { state = JSON.parse(document.getElementById("state").textContent); } catch { state = { defunt: "", fold: true, size: 10, items: [] }; }
  state.size = state.size || 10;

  const $ = id => document.getElementById(id);
  const sheetsEl = $("sheets"), statusEl = $("status");
  let dirty = false;

  const setStatus = (msg, isDirty) => { statusEl.textContent = msg; statusEl.classList.toggle("dirty", !!isDirty); };
  const markDirty = () => { dirty = true; setStatus("Modifications non enregistrées", true); };
  const uid = () => "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const el = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };

  // A box shows one part of a testimony: the title opens part 0, the signature closes the last part.
  function boxEl(it, i, text = it.texte, part = 0, sep = "") {
    return el(`<article class="box s${i % 4}${part ? " contd" : ""}" data-id="${it.id}" lang="fr">
      <div class="ctl">
        ${it.titre ? "" : `<button type="button" data-act="titre">+ Titre</button>`}
        <button type="button" data-act="up" aria-label="Déplacer avant">↑</button>
        <button type="button" data-act="down" aria-label="Déplacer après">↓</button>
        <button type="button" data-act="del" class="danger">Supprimer</button>
      </div>
      ${it.titre && !part ? `<div class="titre" contenteditable="plaintext-only" spellcheck="true" data-k="titre" data-ph="Titre">${esc(it.titre)}</div>` : ""}
      <div class="text" contenteditable="plaintext-only" spellcheck="true" data-k="texte" data-ph="Collez ou écrivez le témoignage ici" data-sep="${esc(sep)}">${esc(text)}</div>
      <div class="sig" contenteditable="plaintext-only" spellcheck="true" data-k="auteur" data-ph="Nom de la personne qui témoigne">${esc(it.auteur)}</div>
    </article>`);
  }

  function newPage(first) {
    const p = el(`<section class="page"><div class="flow"></div><div class="pno"></div></section>`);
    if (first) p.firstElementChild.appendChild(el(`<header class="head"><div class="banner">TÉMOIGNAGES</div><p class="mem"><span>EN MÉMOIRE DE</span><b>${esc(state.defunt || "…")}</b></p><div class="dates">1949 – 2026</div></header>`));
    return p;
  }

  // Lay the boxes out page by page: a box that does not fit moves to the next page.
  // Pages are measured inside a temporary, unscaled sheet.
  function paginate() {
    const probe = el(`<div class="sheet" style="position:absolute;left:-100000px;top:0"></div>`);
    document.body.appendChild(probe);
    const pages = [];
    let page;
    const nextPage = () => { page = newPage(!pages.length); probe.appendChild(page); pages.push(page); };
    const flow = () => page.firstElementChild;
    const fits = () => flow().scrollHeight <= flow().clientHeight + 1;
    const alone = () => flow().querySelectorAll(".box").length === 1;
    nextPage();

    // Only long testimonies are split, at the end of a sentence, leaving a real piece on each page.
    const MIN = 250;
    function splitAt(b, text) {
      if (text.length < 900) return null;
      const t = b.querySelector(".text"), sig = b.querySelector(".sig");
      sig.hidden = true; b.classList.add("cont");
      const cuts = [...text.matchAll(/\s+/g)]
        .filter(m => /[.!?…:»]$/.test(text.slice(0, m.index)) || m[0].includes("\n"))
        .map(m => m.index).filter(x => x >= MIN && text.length - x >= MIN);
      let lo = 0, hi = cuts.length - 1, best = -1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        t.textContent = text.slice(0, cuts[mid]);
        if (fits()) { best = mid; lo = mid + 1; } else hi = mid - 1;
      }
      if (best < 0) { t.textContent = text; sig.hidden = false; b.classList.remove("cont"); return null; }
      t.textContent = text.slice(0, cuts[best]);
      sig.remove();
      return cuts[best];
    }

    state.items.forEach((it, i) => {
      let rest = it.texte, part = 0, sep = "";
      for (;;) {
        const b = boxEl(it, i, rest, part, sep);
        b.style.setProperty("--fs", state.size + "pt");
        flow().appendChild(b);
        if (fits()) break;
        const cut = splitAt(b, rest);
        if (cut != null) {
          sep = rest.slice(cut).match(/^\s+/)[0];
          rest = rest.slice(cut + sep.length); part++;
          nextPage(); continue;
        }
        if (!alone()) { b.remove(); nextPage(); continue; }
        b.insertAdjacentHTML("beforeend", `<div class="warn">Ce témoignage ne rentre pas sur la page : raccourcissez-le ou choisissez un texte plus petit.</div>`);
        break;
      }
    });
    if (!state.items.length) flow().insertAdjacentHTML("beforeend", `<p class="empty-note">Aucun témoignage.<br>Cliquez sur « + Ajouter un témoignage ».</p>`);
    probe.remove();
    return pages;
  }

  function render() {
    $("defunt").value = state.defunt || "";
    $("fold").checked = !!state.fold;
    $("size").value = String(state.size);
    const pages = paginate();
    if (pages.length % 2) pages.push(newPage(false));
    pages.forEach((p, i) => { p.querySelector(".pno").textContent = p.querySelector(".box, .head") ? String(i + 1) : ""; });
    sheetsEl.innerHTML = "";
    for (let s = 0; s < pages.length / 2; s++) {
      sheetsEl.appendChild(el(`<div class="sheet-label">Feuille ${s + 1}</div>`));
      const wrap = el(`<div class="sheet-wrap"><div class="sheet${state.fold ? " fold" : ""}"></div></div>`);
      wrap.firstElementChild.append(pages[2 * s], pages[2 * s + 1]);
      sheetsEl.appendChild(wrap);
    }
    sheetsEl.querySelectorAll("[contenteditable]").forEach(e => { if (e.contentEditable !== "plaintext-only") e.contentEditable = "true"; });
    const used = pages.filter(p => p.querySelector(".box, .head")).length;
    const c = $("count");
    c.textContent = `${state.items.length} témoignage${state.items.length > 1 ? "s" : ""} sur ${used} page${used > 1 ? "s" : ""}.` + (used % 4 ? " Une feuille A4 pliée recto-verso fait 4 pages." : "");
    layout();
  }

  // Scale each sheet to the available width; under 760px show the two pages stacked.
  function layout() {
    const avail = sheetsEl.clientWidth - 32;
    document.documentElement.classList.toggle("narrow", avail < 760);
    sheetsEl.querySelectorAll(".sheet-wrap").forEach(w => {
      const sh = w.firstElementChild;
      const W = sh.offsetWidth, H = sh.offsetHeight, k = Math.min(1, avail / W);
      sh.style.transform = `scale(${k})`;
      w.style.width = W * k + "px"; w.style.height = H * k + "px";
    });
  }

  const indexOf = node => { const b = node.closest(".box"); return b ? state.items.findIndex(x => x.id === b.dataset.id) : -1; };

  // Typing updates the data in place; the layout is redone when the cursor leaves the box.
  let needsFlow = false;
  sheetsEl.addEventListener("input", e => {
    const f = e.target.closest("[data-k]"); if (!f) return;
    const i = indexOf(f); if (i < 0) return;
    if (f.dataset.k === "texte") {
      // A testimony split over two pages is rebuilt from all its parts.
      const parts = [...sheetsEl.querySelectorAll(`.box[data-id="${state.items[i].id}"] [data-k=texte]`)];
      state.items[i].texte = parts.map((t, j) => (j ? t.dataset.sep || " " : "") + t.innerText.replace(/\n$/, "")).join("");
    } else state.items[i][f.dataset.k] = f.textContent.trim();
    needsFlow = true; markDirty();
  });
  sheetsEl.addEventListener("focusout", e => {
    if (!needsFlow) return;
    if (e.relatedTarget && e.relatedTarget.closest?.(".box") === e.target.closest(".box")) return;
    needsFlow = false; setTimeout(render, 0);
  });
  sheetsEl.addEventListener("paste", e => {
    const f = e.target.closest("[contenteditable]"); if (!f) return;
    e.preventDefault();
    let txt = (e.clipboardData || window.clipboardData).getData("text/plain");
    if (f.dataset.k !== "texte") txt = txt.replace(/\s*\n\s*/g, " ");
    document.execCommand("insertText", false, txt);
  });
  sheetsEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.closest("[data-k=auteur],[data-k=titre]")) e.preventDefault();
  });

  // Box buttons. Deleting asks for a second click instead of a dialog.
  sheetsEl.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const i = indexOf(b); if (i < 0) return;
    const items = state.items, act = b.dataset.act;
    if (act === "titre") { items[i].titre = "Titre"; }
    else if (act === "up" && i > 0) { [items[i - 1], items[i]] = [items[i], items[i - 1]]; }
    else if (act === "down" && i < items.length - 1) { [items[i + 1], items[i]] = [items[i], items[i + 1]]; }
    else if (act === "del") {
      if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Confirmer ?"; setTimeout(() => { if (b.isConnected) { b.dataset.armed = ""; b.textContent = "Supprimer"; } }, 3000); return; }
      items.splice(i, 1);
    } else return;
    needsFlow = false; markDirty(); render();
  });

  $("defunt").addEventListener("input", e => {
    state.defunt = e.target.value.trim();
    const p = sheetsEl.querySelector(".mem b"); if (p) p.textContent = state.defunt || "…";
    markDirty();
  });
  $("size").addEventListener("change", e => { state.size = Number(e.target.value); markDirty(); render(); });
  $("fold").addEventListener("change", e => { state.fold = e.target.checked; markDirty(); render(); });
  $("add").addEventListener("click", () => {
    const it = { id: uid(), titre: "", auteur: "", texte: "" };
    state.items.push(it);
    markDirty(); render();
    const box = sheetsEl.querySelector(`.box[data-id="${it.id}"]`);
    box.scrollIntoView({ behavior: "smooth", block: "center" });
    box.querySelector("[data-k=auteur]").focus();
  });
  window.addEventListener("resize", layout);

  // Save: republish this page with the current data embedded.
  $("save").addEventListener("click", async () => {
    const btn = $("save");
    const artifact = await window.claude?.use?.("artifact");
    if (!artifact) { setStatus("L'enregistrement n'est pas disponible ici. Téléchargez le PDF pour garder votre travail.", true); return; }
    btn.disabled = true; setStatus("Enregistrement…");
    const json = JSON.stringify(state).replace(/</g, "\\u003c");
    const html = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + SRC.reset + "</style></head><body>"
      + SRC.head + "\n\n" + SRC.app + "\n\n" + SRC.libs + "\n" + '<script type="application/json" id="state">' + json + "<\/script>\n" + SRC.script + "</body></html>";
    try { await artifact.publish(html); dirty = false; setStatus("Enregistré"); }
    catch (err) {
      const code = err && err.code;
      setStatus(code === "not_writer" || code === "not_granted" ? "Vous pouvez lire cette page mais pas l'enregistrer. Téléchargez le PDF à la place."
        : code === "conflict" ? "Une autre version vient d'être enregistrée. La page va se recharger."
        : "L'enregistrement a échoué. Réessayez dans un instant.", true);
    } finally { btn.disabled = false; }
  });

  // PDF: one A4-landscape page per sheet, rendered at full size off screen.
  $("pdf").addEventListener("click", async () => {
    const btn = $("pdf");
    if (!window.html2canvas || !window.jspdf) { setStatus("Le module PDF n'a pas pu se charger. Rechargez la page.", true); return; }
    const downloads = await window.claude?.use?.("downloads");
    if (!downloads) { setStatus("Le téléchargement n'est pas disponible dans cette vue.", true); return; }
    btn.disabled = true; setStatus("Création du PDF…");
    const host = $("export-host");
    const wasNarrow = document.documentElement.classList.contains("narrow");
    document.documentElement.classList.remove("narrow");
    host.className = "exporting"; host.innerHTML = "";
    try {
      await document.fonts?.ready;
      const pdf = new window.jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
      const sheets = [...sheetsEl.querySelectorAll(".sheet")];
      for (let s = 0; s < sheets.length; s++) {
        const clone = sheets[s].cloneNode(true);
        clone.style.transform = "none"; clone.style.position = "relative"; clone.style.boxShadow = "none";
        host.appendChild(clone);
        const canvas = await html2canvas(clone, { scale: 2.5, backgroundColor: "#ffffff", logging: false });
        if (s) pdf.addPage();
        pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, 297, 210);
        host.innerHTML = "";
      }
      const name = "Temoignages" + (state.defunt ? " - " + state.defunt : "") + ".pdf";
      await downloads.save({ filename: name, data: pdf.output("blob") });
      setStatus(dirty ? "PDF prêt. Pensez aussi à enregistrer." : "PDF prêt", dirty);
    } catch (err) {
      setStatus(err && err.code === "declined" ? "Téléchargement annulé." : "Le PDF n'a pas pu être créé. Réessayez.", true);
    } finally {
      host.innerHTML = ""; host.className = "";
      if (wasNarrow) document.documentElement.classList.add("narrow");
      btn.disabled = false;
    }
  });

  render();
  document.fonts?.ready.then(render);
  // Font faces load lazily the first time a style is used; lay out again once they arrive.
  let fontTimer;
  document.fonts?.addEventListener?.("loadingdone", () => { clearTimeout(fontTimer); fontTimer = setTimeout(render, 50); });
})();
</script>
